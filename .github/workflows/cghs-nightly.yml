name: CGHS hospitals → DakSi (nightly)

on:
  schedule:
    - cron: '30 20 * * *'   # 2:00 AM IST every night
  workflow_dispatch: {}      # "Run workflow" button for a manual run

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read CGHS and update DakSi
        env:
          CGHS_PUSH_KEY: ${{ secrets.CGHS_PUSH_KEY }}
        run: node scripts/cghs-push.mjs
