<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postal Rulings · Cozy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#6A2C5A">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Literata:opsz,wght@7..72,400;7..72,700&family=Mukta:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:20px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}
.wrap{max-width:960px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
.search{display:block;width:100%;height:50px;margin:0 0 14px;padding:0 18px;border-radius:var(--search-r);border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font:500 15px var(--font-body);outline:none}
.search:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.chips{display:flex;flex-wrap:nowrap;gap:8px;margin:0 0 20px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;white-space:nowrap}
.chip{height:36px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);font:700 13px var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.chip:focus-visible,.back:focus-visible,.save:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{font-size:20px;font-weight:700;margin:4px 0 14px}
.page{font-size:clamp(26px,6vw,36px);font-weight:800;margin:6px 0 10px}
.note{font-size:12.5px;color:var(--ink-soft);margin:4px 2px 16px}
.empty{display:none;text-align:center;padding:30px 10px;color:var(--ink-soft)}
.empty.show{display:block}
.rack{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.env,.letter,.arch{min-width:0;text-align:left;cursor:pointer;color:inherit;font:inherit;border:0;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.back,.save{height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font:700 13px var(--font-body);cursor:pointer}
.save[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.doc{white-space:pre-wrap;word-wrap:break-word;font:400 15px/1.7 var(--font-body);color:var(--ink);background:var(--card);border-radius:14px;padding:18px;margin:0;box-shadow:var(--shadow)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);border-top:1px solid var(--rule);z-index:50}
.nav a{flex:1;max-width:120px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;text-decoration:none;font:700 10.5px var(--font-body);color:var(--ink-soft);padding:6px 2px;border-radius:12px}
.nav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav a[aria-current="page"]{background:var(--accent-fill);color:var(--accent-ink)}
.summary{font-size:15px;color:var(--ink-soft);margin:0 0 12px}
.pdf{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--accent-fill);color:var(--accent-ink);font:700 13.5px var(--font-body);text-decoration:none;margin:0 0 16px}
.pdf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec .count{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:8px}
.more{display:block;margin:22px auto 0;height:42px;padding:0 22px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font:700 13.5px var(--font-body);cursor:pointer}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* reader */
.tb-right{display:flex;gap:8px}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 6px}
.dept{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.rtitle{font-size:clamp(24px,5.5vw,34px);line-height:1.15}
.ractions{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 16px}
.pdf.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.st{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--st-bg,#E6F0E2);color:var(--st-fg,#2F6A3A)}
.st-superseded{--st-bg:#FCEFD6;--st-fg:#8A5A00}
.st-repealed{--st-bg:#F8DEDA;--st-fg:#9E2F2A}
.st-draft{--st-bg:#ECE7E2;--st-fg:#5F564F}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:0 0 20px}
.mcell{background:var(--card);padding:10px 12px;min-width:0}
.mk{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.mv{font-size:14.5px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;margin-top:2px}
.dash{color:var(--ink-soft);font-weight:400;font-style:italic}
.rsec{margin:0 0 22px}
.rsec-h{font-size:19px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.sumbox,.amend{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);font-size:15px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.amend{white-space:pre-wrap;border-left:4px solid var(--accent)}
.muted{color:var(--ink-soft);margin:0}
.docbox{background:var(--doc-bg,var(--card));color:var(--doc-ink,var(--ink));border-radius:12px;padding:18px;box-shadow:var(--shadow);font-size:15px;line-height:1.65;overflow-wrap:anywhere;overflow-x:auto}
.docbox table{border-collapse:collapse;max-width:100%}
.docbox td,.docbox th{border:1px solid #C9B9A3;padding:6px 8px;vertical-align:top}
.docbox img{max-width:100%;height:auto}
/* saved rows */
.srows{display:flex;flex-direction:column;gap:12px}
.srow{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;min-width:0;border-left:4px solid var(--accent)}
.srow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.srow-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.omno{font:700 12px ui-monospace,Consolas,monospace;color:var(--ink)}
.srow-title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.25;color:var(--ink)}
.srow-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
/* share sheet and dialogs */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,6,4,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:480px;background:var(--card);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sheet-title{margin:0 0 12px;color:var(--ink-soft)}
.sheet-btns{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
.sheet ol{margin:0 0 14px;padding-left:20px;line-height:1.6}
/* logo, header buttons, tools, download banner */
.logo{width:64px;height:64px;border-radius:50%;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);font:700 12.5px var(--font-body);text-decoration:none;cursor:pointer}
.hbtn .ver{font-size:11px;opacity:.75}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 20px}
.tool{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;min-width:0}
.tool b{font-family:var(--font-display);font-size:15px;line-height:1.2}
.tool small{font-size:11.5px;color:var(--ink-soft)}
.tool:focus-visible,.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dlbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:560px;margin:0 auto}
.dlbar img{width:44px;height:44px;border-radius:50%}
.dlbar .dltxt{flex:1;min-width:0;font-size:13px;line-height:1.35}
.dlbar .dltxt b{display:block;font-family:var(--font-display);font-size:15px}
.dlbar .x{border:0;background:transparent;color:var(--ink-soft);font-size:22px;cursor:pointer;width:34px;height:34px}
body[data-route="read"]{padding-bottom:40px}
.sumlabel{font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-left:8px}
.sumbox p{margin:0 0 8px}
.sumbox ul{margin:0;padding-left:20px}
.sumbox li{margin:4px 0}
.pbar{display:flex;justify-content:flex-end;margin:0 0 8px}
.pbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent-fill);color:var(--accent-ink);font:800 16px var(--font-body);text-decoration:none}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.prow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.pavatar{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent-fill);color:var(--accent-ink);font:800 22px var(--font-display);flex:0 0 auto}
.pname{font-family:var(--font-display);font-size:20px;font-weight:700}
.pcontact{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.plink{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none}
.pbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sheet-wrap.center{align-items:center}
.sheet .search{margin-bottom:10px}
.wide{display:flex;justify-content:center;width:100%;margin-top:8px;border:0;cursor:pointer}
.dk-log{display:flex;flex-direction:column;gap:12px;margin:0 0 14px}
.dk-msg{max-width:92%;border-radius:16px;padding:12px 14px;line-height:1.55;overflow-wrap:anywhere}
.dk-msg.me{align-self:flex-end;background:var(--accent-fill);color:var(--accent-ink)}
.dk-msg.bot{align-self:flex-start;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.dk-msg p{margin:0 0 8px}.dk-msg ul{margin:4px 0 8px;padding-left:20px}
.dk-msg blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);color:var(--ink-soft)}
.dk-h{font-family:var(--font-display);font-size:16px;margin:10px 0 4px}
.dk-ref{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;border:0;background:var(--accent-fill);color:var(--accent-ink);font:800 11px var(--font-body);cursor:pointer;vertical-align:1px}
.dk-srcs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dk-src{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit}
.dk-src small{color:var(--ink-soft)}
.dk-faq{border-top:1px solid var(--rule)}
.dk-q{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:600 15px var(--font-body);padding:12px 0;cursor:pointer}
.dk-a{padding:0 0 12px}
.dk-ask{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px 0;background:var(--paper)}
.dk-ask .search{margin:0}
.dk-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:55;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--accent-fill);color:var(--accent-ink);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.dk-fab:focus-visible,.dk-q:focus-visible,.dk-src:focus-visible,.dk-ref:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dlbar ~ .dk-fab{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dcell{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px;border-radius:12px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font:inherit}
.dcell b{font-family:var(--font-display);font-size:16px}.dcell small{color:var(--ink-soft)}
.tablewrap{overflow-x:auto;border-radius:12px;box-shadow:var(--shadow);background:var(--card)}
.sumtable{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
.sumtable th,.sumtable td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;color:var(--ink)}
.sumtable tbody tr{cursor:pointer}.sumtable tbody tr:hover{background:var(--paper)}
.sumtable .tt{font-weight:700;min-width:200px}.sumtable .sm{min-width:260px;color:var(--ink-soft)}.mono{font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.th{border:0;background:transparent;color:var(--ink);font:800 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.fl{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.fl select,.pcard select{height:44px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font:500 14px var(--font-body);padding:0 10px;text-transform:none;letter-spacing:0;max-width:100%}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--paper)}
.segb{flex:1;min-width:0;height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:700 13px var(--font-body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segb[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-ink)}
.hcard,.rate{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.hmeta{margin:4px 0 0;font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}.hsp{margin:6px 0 0;font-size:13px;color:var(--ink)}
.hlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hlink{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);font:700 12.5px var(--font-body);text-decoration:none;cursor:pointer}
.hlink.sel{user-select:all;cursor:text}.hlink[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}
.rate{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.rate-l{min-width:0}.rate-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap}
.rate-r b{font-size:16px;color:var(--ink)}
.cart{list-style:none;margin:0;padding:0}.cart li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}.cart li span{flex:1;min-width:0}
.cart .x{border:0;background:transparent;color:var(--ink-soft);font-size:20px;cursor:pointer;width:30px;height:30px}
.carttotal{display:flex;justify-content:space-between;margin:10px 0 0;font-size:16px}
.small{font-size:12.5px;margin:4px 0 10px}
.dk-nav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 14px;width:max-content;max-width:100%;padding:6px 8px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--rule)}
.dk-arrow{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent-fill);color:var(--accent-ink);cursor:pointer}
.dk-arrow:disabled{opacity:.35;cursor:default}
.dk-arrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dk-count{font:700 12.5px var(--font-body);color:var(--ink);white-space:nowrap}
.dk-msg.me:focus{outline:2px solid var(--accent);outline-offset:3px}
.saved-bk summary{cursor:pointer;font:700 15px var(--font-display);color:var(--ink)}
.bk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule);flex-wrap:wrap}
.bk b{display:block}.bk small{color:var(--ink-soft)}
.sumbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.sumbar .seg{flex:0 1 280px}.sumtools{display:flex;flex-wrap:wrap;gap:8px}
.ompick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.ompick label{font-size:12.5px;font-weight:700;color:var(--ink-soft)}.ompick .search{flex:1 1 200px;margin:0;height:42px}
.sumtable{table-layout:fixed}.sumtable th{position:relative}
.sumtable td{overflow-wrap:anywhere}
.rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;touch-action:none;z-index:2}
.rz::after{content:"";position:absolute;top:20%;bottom:20%;left:4px;width:2px;border-radius:2px;background:var(--rule)}
.rz:hover::after,.rz:focus-visible::after{background:var(--accent)}
.rz:focus-visible{outline:none}
.sumtable tr.grp td{background:var(--paper);font-size:12.5px;border-top:2px solid var(--accent)}
.sumtable tr.grp{cursor:default}
.sumtable .st{white-space:nowrap;overflow-wrap:normal;font-size:10px;padding:2px 7px;letter-spacing:.03em}

/* ---- Rate finder ---- */
.rfinder{background:var(--card);border-radius:22px;box-shadow:0 22px 50px -28px rgba(10,20,60,.45),0 0 0 1px var(--rule);overflow:hidden;margin:0 0 22px}
.rf-head{position:relative;display:flex;align-items:center;gap:14px;padding:18px 20px;color:var(--accent-ink);background:linear-gradient(120deg,var(--accent-fill),color-mix(in srgb,var(--accent-fill) 55%,#ffffff 10%));overflow:hidden}
.rf-head::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);pointer-events:none}
.rf-h-ic{display:grid;place-items:center;flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rf-kick{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.rf-sum{display:flex;flex-wrap:wrap;gap:6px}
.rf-chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);font-size:12.5px;font-weight:700;white-space:nowrap}
.rf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px;padding:16px 20px 20px}
.rf-col{min-width:0}
.rf-step{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.rf-n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-fill);color:var(--accent-ink);font-size:11px;letter-spacing:0}

  dropEmptyTblWraps_(full) {
    [this._doc, this._sum].forEach(t => {
      if (!t) return;
      // Empty rows left at the end of a table (all cells blank) are removed.
      if (full) t.querySelectorAll('table:not([data-rl-keep])').forEach(tb => {
        const blankRow = (r) => r && Array.from(r.cells).every(c => !(c.textContent || '').replace(/[\s\u00a0\u200b]/g, '') && !c.querySelector('img'));
        let r = tb.rows[tb.rows.length - 1];
        // A row that a merged cell above reaches into (rowSpan), or that has no
        // cells of its own, is part of a merge: removing it undid the merge.
        const merged = (row) => { const ix = row.rowIndex; return !row.cells.length || Array.from(tb.rows).slice(0, ix).some((o, k) => Array.from(o.cells).some(c => k + (c.rowSpan || 1) > ix)); };
        while (r && tb.rows.length > 1 && blankRow(r) && !merged(r)) { r.remove(); r = tb.rows[tb.rows.length - 1]; }
      });
      // Text typed after a table can end up inside the table's frame; it is
      // moved out so the frame holds only the table.
      t.querySelectorAll('[data-rl-tblwrap]').forEach(w => {
        const tb = Array.from(w.children).find(c => c.tagName === 'TABLE');
        if (!tb) return;
        let after = w;
        Array.from(w.childNodes).forEach(n => {
          if (n === tb) return;
          if (n.nodeType === 3 && !n.textContent.trim()) { n.remove(); return; }
          if (n.nodeType === 1 && n.tagName === 'CAPTION') return;
          const before = Array.from(w.childNodes).indexOf(n) < Array.from(w.childNodes).indexOf(tb);
          if (before) w.parentNode.insertBefore(n, w); else { after.after(n); after = n; }
        });
      });
      t.querySelectorAll('[data-rl-tblwrap], div[style*="border"], div[style*="box-shadow"]').forEach(w => {
        if (!w.isConnected || w.querySelector('table,img,iframe,video')) return;
        if (!w.hasAttribute('data-rl-tblwrap') && !/border-radius|box-shadow/.test(w.getAttribute('style') || '')) return;
        if ((w.textContent || '').replace(/[\s\u00a0\u200b]/g, '')) { w.replaceWith(...Array.from(w.childNodes)); return; }
        w.remove();
      });
    });
  }

  summaryTablesHtml_(html) {
    if (!html || html.indexOf('<table') < 0) return html || '';
    try {
      const d = document.createElement('div'); d.innerHTML = html;
      const light = (v) => /^(#fff|#ffffff|white|#fcfaf6|#fafafa|#f9f9f9|rgb\(255,\s*255,\s*255\)|rgb\(252,\s*250,\s*246\))$/i.test(String(v || '').trim());
      d.querySelectorAll('[data-rl-tblwrap]').forEach(w => { w.style.setProperty('background', 'transparent'); w.style.setProperty('box-shadow', 'none'); });
      d.querySelectorAll('table').forEach(tb => { try { this.tightenCells_(tb); } catch (e) {} });
      d.querySelectorAll('table, tbody, thead, tr, td, th').forEach(n => {
        const bg = n.style.backgroundColor || n.style.background;
        if (n.tagName === 'TH' || /b30000|179,\s*0,\s*0/i.test(String(bg))) return;
        if (!bg || light(bg) || /^rgba?\(/.test(bg) && light(bg)) { n.style.removeProperty('background'); n.style.removeProperty('background-color'); }
        else if (n.tagName === 'TR' || n.tagName === 'TD') { n.style.removeProperty('background'); n.style.removeProperty('background-color'); }
        n.removeAttribute('bgcolor');
      });
      return d.innerHTML;
    } catch (e) { return html; }
  }

  tightenCells_(tb) {
    Array.from(tb.querySelectorAll('td,th')).forEach(cell => {
      const blank = (n) => n && ((n.nodeType === 3 && !n.textContent.replace(/[\s\u00a0\u200b]/g, '')) || (n.nodeType === 1 && (n.tagName === 'BR' || (/^(P|DIV|SPAN)$/.test(n.tagName) && !n.querySelector('img,table') && !(n.textContent || '').replace(/[\s\u00a0\u200b]/g, '')))));
      while (blank(cell.firstChild)) cell.firstChild.remove();
      while (blank(cell.lastChild)) cell.lastChild.remove();
      cell.querySelectorAll('p,div').forEach(p => {
        if (blank(p)) { p.remove(); return; }
        p.style.setProperty('margin', '0', 'important'); p.style.setProperty('padding', '0', 'important');
        p.style.setProperty('line-height', '1.4', 'important'); p.style.removeProperty('text-indent');
        while (p.lastChild && p.lastChild.nodeName === 'BR') p.lastChild.remove();
      });
      cell.querySelectorAll('br + br').forEach(b => b.remove());
      cell.style.setProperty('vertical-align', 'top');
      cell.style.setProperty('line-height', '1.4');
    });
  }
  }
  var df = new DocFix();
  return {
    doc: function (html) {
      if (!html) return '';
      var out = html;
      try { out = df.styleTables(out); } catch (e) {}
      try { out = df.normalizeShortLines_(out); } catch (e) {}
      return out;
    },
    summary: function (html) {
      if (!html) return '';
      try { return df.summaryTablesHtml_(df.dropEmptyBoxesHtml_(html)); } catch (e) { return html; }
    }
  };
})();

  // Same summary the app writes when no admin summary exists (copied from the app).
  function localSummary(raw) {
    const lines = String(raw || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(x => x.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
    if (lines.join('').length < 80) return '';
    let subject = '', subjAt = -1;
    for (let i = 0; i < lines.length && subjAt < 0; i++) {
      const m = /^sub(?:ject)?\s*[:\-\u2013.]\s*(.*)$/i.exec(lines[i]); if (!m) continue;
      subject = m[1]; subjAt = i; let j = i + 1;
      while (j < lines.length && subject.length < 400 && !/[.]$/.test(subject) && lines[j].length < 170 && !/^(sir|madam|i am directed|the undersigned|please refer|reference|ref\b|\d+[.)]\s)/i.test(lines[j])) { subject += ' ' + lines[j]; j++; }
      subjAt = j;
    }
    subject = subject.replace(/\s+/g, ' ').replace(/[.;,\s]+$/, '').trim();
    const flat = lines.slice(Math.max(0, subjAt)).join(' ').replace(/\s+/g, ' ');
    const prot = flat.replace(/\b(No|Nos|Rs|Dr|Sh|Smt|Shri|Dt|dtd|Ref|Sl|Vol|Para|Art|Sec|Govt|Dept|Dy|Asst|Addl|Ltd|etc|viz|St|w\.e\.f|i\.e|e\.g)\./gi, '$1\u0001').replace(/(\d)\.(\d)/g, '$1\u0001$2').replace(/\b([A-Z])\.(?=\s?[A-Z0-9])/g, '$1\u0001');
    const sents = prot.replace(/([.!?])\s+/g, '$1\n').split('\n').map(s => s.replace(/\u0001/g, '.').trim());
    const KW = /\b(shall|hereby|with effect|w\.?e\.?f\.?|revis\w*|amend\w*|standardi[sz]\w*|direct\w*|approv\w*|notif\w*|permit\w*|allowed|entitle\w*|withdraw\w*|supersed\w*|cut-?off|rates?|effective|come into force|clarif\w*|decided|applicable|eligible|admissible|extended|enhanc\w*|increas\w*|reduc\w*|ceiling|limit\w*|per cent|competent authority|sanction\w*)\b|%|\u20b9|\bRs\b/gi;
    const SKIP = /^(sir|madam|yours|copy to|reference|please refer|in this connection|this issues|the undersigned is directed to forward|to,?$|government of india|ministry of|department of|directorate|dak bhawan|f\.?\s?no|no\.?\s?[\w\/-]+\s)/i;
    const lead = /^(?:\d{1,2}[.)]\s*)?(?:I am directed to (?:say|convey|state|inform|refer)(?: that)?,?\s*|It is (?:hereby )?(?:informed|stated|clarified) that\s*)/i;
    const cands = sents.map((s, i) => { s = s.replace(lead, '').trim(); return { s: s.charAt(0).toUpperCase() + s.slice(1), i }; })
      .filter(o => o.s.length >= 40 && o.s.length <= 420 && !SKIP.test(o.s))
      .map(o => ({ ...o, score: (o.s.match(KW) || []).length + (/\d/.test(o.s) ? 1 : 0) + (o.i < 6 ? 0.5 : 0) }))
      .filter(o => o.score >= 1.5);
    const seen = {}, pick = cands.sort((p, q) => q.score - p.score || p.i - q.i).filter(o => { const k = o.s.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 60); if (seen[k]) return false; seen[k] = 1; return true; })
      .slice(0, 5).sort((p, q) => p.i - q.i).map(o => o.s);
    const cut = (s) => { if (s.length <= 320) return s; const k = Math.max(s.lastIndexOf(';', 300), s.lastIndexOf(',', 300)); return (k > 150 ? s.slice(0, k) : s.slice(0, 300).replace(/\s\S*$/, '')) + '.'; };
    const end = (s) => (/[.!?]$/.test(s) ? s : s + '.');
    const eff = /(?:with effect from|w\.?e\.?f\.?|effective from|come into force on)\s+((?:\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4})|(?:\d{1,2}(?:st|nd|rd|th)?\s+[A-Z][a-z]+,?\s+\d{4})|(?:[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}))/i.exec(flat);
    const sup = /\b(supersed\w+|in (?:partial )?modification of|in continuation of)\b[^.]{0,180}/i.exec(flat);
    const out = []; let first = '';
    if (subject) first = end(subject.charAt(0).toUpperCase() + subject.slice(1)); else if (pick.length) first = end(cut(pick.shift()));
    if (!first) return '';
    out.push(first);
    pick.filter(s => s.toLowerCase().indexOf(subject.toLowerCase().slice(0, 40)) < 0 || !subject).slice(0, 4).forEach(s => out.push('- ' + end(cut(s))));
    const body = out.join(' ').toLowerCase();
    if (eff && body.indexOf(eff[1].toLowerCase()) < 0) out.push('- Effective from ' + eff[1] + '.');
    if (sup && body.indexOf(sup[0].toLowerCase().slice(0, 40)) < 0) out.push('- ' + end(cut(sup[0].replace(/\s+/g, ' ').trim().replace(/^./, c => c.toUpperCase()))));
    return out.join('\n');
  }
  // Formatted posts are admin-written HTML. Keep their layout, drop anything that could run code.
  function sanitize(html) {
    try {
      var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
      var root = doc.body.firstChild;
      root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(function (n) { n.remove(); });
      root.querySelectorAll('*').forEach(function (n) {
        Array.prototype.slice.call(n.attributes).forEach(function (a) {
          var name = a.name.toLowerCase(), v = String(a.value || '').trim().toLowerCase();
          if (name.indexOf('on') === 0) n.removeAttribute(a.name);
          else if ((name === 'href' || name === 'src') && v.indexOf('javascript:') === 0) n.removeAttribute(a.name);
        });
        if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); }
      });
      return root.innerHTML;
    } catch (e) { return esc(html); }
  }
