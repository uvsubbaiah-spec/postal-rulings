<style>

.mast .logo{width:70px;height:70px;box-shadow:none}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>window.RL_CONFIG = { endpoint: "https://script.google.com/macros/s/AKfycbzOgdHHSat3LJS7cM1HfLXtQ0ntjvMwxLLwxjOciRepbtIN66B6BwnYDYcjm4cGR_bB6w/exec" };</script>
<script>
/* Postal Rulings: shared core (data, search, reader, saved). Theme files supply markup. */
(function (global) {
  var ENDPOINT = (global.RL_CONFIG && global.RL_CONFIG.endpoint) || '';
  var KEY_IDX = 'rl_index_v2', KEY_SAVED = 'rl_saved';
  var state = { ov: {}, byId: {}, items: [], cats: [], loaded: false, error: '', query: '', cat: '', saved: [], text: {}, route: 'home' };

  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function fetchJson(url) {
    return fetch(url, { redirect: 'follow', cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    });
  }
  function loadSaved() { try { state.saved = JSON.parse(localStorage.getItem(KEY_SAVED) || '[]') || []; } catch (e) { state.saved = []; } }
  function toggleSaved(id) {
    var i = state.saved.indexOf(id);
    if (i >= 0) state.saved.splice(i, 1); else state.saved.push(id);
    store(KEY_SAVED, state.saved);
  }
  function isSaved(id) { return state.saved.indexOf(id) >= 0; }

  function cleanName(n) { return String(n || '').replace(/\.(pdf|jpe?g|png|docx?|xlsx?|txt)$/i, '').trim(); }
  function shortDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''));
    if (m) return m[3] + '.' + m[2] + '.' + m[1];
    return String(d || '');
  }
  function sortedByDate(items) {
    return items.slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  }
  function norm(s) { return String(s || '').toLowerCase(); }

  function applyIndex(d) {
    var items = (d && d.items) || [];
    if (!items.length) return false;
    state.items = items.filter(function (x) { return x && x.id; }).map(function (x) {
      var prev = state.byId && state.byId[x.id];
      return { id: String(x.id), name: cleanName(x.name), date: x.date || '', category: x.category || 'Other',
        orderNo: x.orderNo || '', status: x.status || '', summary: x.summary || '',
        url: x.url || (prev && prev.url) || '',
        text: x.text || (prev && prev.text) || '' };
    });
    state.byId = {};
    state.items.forEach(function (x) { state.byId[x.id] = x; x.hay = norm(x.name + ' ' + x.category + ' ' + x.orderNo + ' ' + x.date + ' ' + x.summary); });
    var seen = {}; state.cats = [];
    state.items.forEach(function (x) { if (!seen[x.category]) { seen[x.category] = 1; state.cats.push(x.category); } });
    state.cats.sort();
    state.loaded = true; state.error = '';
    return true;
  }
  function slim(d) {
    // Keep the device copy small: titles and dates only, no full text.
    return { syncedAt: d.syncedAt || '', items: (d.items || []).map(function (x) {
      return { id: x.id, name: x.name, date: x.date, category: x.category, orderNo: x.orderNo || '', status: x.status || '', summary: x.summary || '', url: x.url || '' }; }) };
  }
  function withTimeout(ms) { var c = window.AbortController ? new AbortController() : null; if (c) setTimeout(function () { c.abort(); }, ms); return c; }
  function loadIndex(onUpdate) {
    // 1. Device copy: instant on repeat visits.
    try { var cached = JSON.parse(localStorage.getItem(KEY_IDX) || 'null'); if (cached) applyIndex(cached); } catch (e) {}
    if (state.loaded && onUpdate) onUpdate();
    // 2. search-index.json from the same site (CDN, about a second), includes the text of every ruling.
    var stat = fetch('search-index.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { if (applyIndex(d)) { store(KEY_IDX, slim(d)); if (onUpdate) onUpdate(); } })
      .catch(function () {});
    // 3. Backend, in the background, for anything newer than the committed file.
    if (!ENDPOINT) return stat;
    var c = withTimeout(45000);
    var live = fetch(ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'export=index&t=' + Date.now(), { redirect: 'follow', cache: 'no-store', signal: c ? c.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { return stat.then(function () { if (applyIndex(d)) { store(KEY_IDX, slim(d)); if (onUpdate) onUpdate(); } }); })
      .catch(function (e) { return stat.then(function () { if (!state.loaded) { state.error = 'Could not load the rulings. Check your connection and try again.'; if (onUpdate) onUpdate(); } }); });
    return live;
  }

  var KEY_OV = 'rl_ov_lean_v2';
  function leanOv(all) {
    var out = {};
    Object.keys(all || {}).forEach(function (id) {
      var o = all[id] || {}, l = {};
      ['title', 'omNo', 'issueDate', 'effective', 'status', 'summary', 'depts', 'amend', 'chain', 'blogUrl'].forEach(function (k) { if (o[k] !== undefined && o[k] !== '') l[k] = o[k]; });
      if (Object.keys(l).length) out[id] = l;
    });
    return out;
  }
  function loadOverrides(onUpdate) {
    try { var c = JSON.parse(localStorage.getItem(KEY_OV) || 'null'); if (c) { state.ov = c; if (onUpdate) onUpdate(); } } catch (e) {}
    if (!ENDPOINT) return Promise.resolve();
    var c2 = withTimeout(60000);
    return fetch(ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'overrides=1&t=' + Date.now(), { redirect: 'follow', cache: 'no-store', signal: c2 ? c2.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.overrides) return;
        var full = d.overrides, lean = leanOv(full);
        Object.keys(full).forEach(function (id) { if (state.ovFull) state.ovFull[id] = full[id]; });
        state.ovFull = full; state.ov = lean; store(KEY_OV, lean);
        if (onUpdate) onUpdate();
      }).catch(function () {});
  }
  function loadOv(id) {
    if (state.ovFull && state.ovFull[id] && (state.ovFull[id].html || state.ovFull[id].text)) return Promise.resolve(state.ovFull[id]);
    if (!ENDPOINT) return Promise.resolve(state.ov[id] || null);
    var c = withTimeout(25000);
    return fetch(ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'ov=' + encodeURIComponent(id) + '&t=' + Date.now(), { redirect: 'follow', cache: 'no-store', signal: c ? c.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (d) { var o = (d && d.override) || null; if (o) { state.ovFull = state.ovFull || {}; state.ovFull[id] = o; } return o; });
  }
  function view(x) {
    // The item as the app shows it: admin corrections win over the Drive file name.
    var o = state.ov[x.id] || {};
    var depts = (o.depts && o.depts.length) ? o.depts : [x.category];
    return { id: x.id, title: o.title || x.name, omNo: o.omNo || x.orderNo || '', issueDate: o.issueDate || '', effective: o.effective || '',
      status: o.status || x.status || '', summary: o.summary || x.summary || '', depts: depts, category: x.category,
      amend: o.amend || '', chain: o.chain || [], blogUrl: o.blogUrl || '', url: x.url || '', date: x.date || '' };
  }
  function loadText(id) {
    if (state.text[id] !== undefined) return Promise.resolve(state.text[id]);
    if (!ENDPOINT) return Promise.resolve({ text: '', html: '' });
    var c = withTimeout(25000);
    return fetch(ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'text=' + encodeURIComponent(id), { redirect: 'follow', signal: c ? c.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { var t = { text: (d && d.text) || '', html: (d && d.html) || '', pending: !!(d && d.pending) }; if (!t.pending) state.text[id] = t; return t; });
  }
  function filtered() {
    var q = norm(state.query).trim(), toks = q ? q.split(/\s+/) : [];
    return state.items.filter(function (x) {
      if (state.cat && x.category !== state.cat) { var od = state.ov[x.id] && state.ov[x.id].depts; if (!(od && od.indexOf(state.cat) >= 0)) return false; }
      if (!toks.length) return true;
      var o = state.ov[x.id];
      var hay = (x.hay || norm(x.name + ' ' + x.category + ' ' + x.date)) + (o ? ' ' + norm((o.title || '') + ' ' + (o.omNo || '') + ' ' + (o.summary || '') + ' ' + (o.depts || []).join(' ')) : '');
      if (state.cat && o && o.depts && o.depts.indexOf(state.cat) >= 0) { /* also listed under its extra departments */ }
      return toks.every(function (t) { return hay.indexOf(t) >= 0; });
    });
  }
  function savedItems() { return state.saved.map(function (id) { return state.items.filter(function (x) { return x.id === id; })[0]; }).filter(Boolean); }

  global.RLCore = {
    state: state, loadIndex: loadIndex, loadText: loadText, toggleSaved: toggleSaved, isSaved: isSaved,
    loadSaved: loadSaved, loadOverrides: loadOverrides, loadOv: loadOv, view: view, filtered: filtered, savedItems: savedItems, sortedByDate: sortedByDate, shortDate: shortDate
  };
})(window);

</script>

      '<span class="open">Open ruling</span></article>';

<script>
/* Postal Rulings: shared screens. Each theme supplies THEME.header, THEME.card, THEME.nav(route). */
(function () {
  var C = window.RLCore, T = window.RL_THEME;
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function go(hash) { location.hash = hash; }
  function fmtDate(d) { return C.shortDate(d); }
  function statusPill(st) {
    if (!st) return '';
    var k = String(st).toLowerCase().replace(/[^a-z]/g, '');
    return '<span class="st st-' + esc(k) + '">' + esc(st) + '</span>';
  }

  // Same summary the app writes when no admin summary exists (copied from the app).
  function localSummary(raw) {
    const lines = String(raw || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(x => x.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
    if (lines.join('').length < 80) return '';
    let subject = '', subjAt = -1;
    for (let i = 0; i < lines.length && subjAt < 0; i++) {
      const m = /^sub(?:ject)?\s*[:\-\u2013.]\s*(.*)$/i.exec(lines[i]); if (!m) continue;
      subject = m[1]; subjAt = i; let j = i + 1;
      while (j < lines.length && subject.length < 400 && !/[.]$/.test(subject) && lines[j].length < 170 && !/^(sir|madam|i am directed|the undersigned|please refer|reference|ref\b|\d+[.)]\s)/i.test(lines[j])) { subject += ' ' + lines[j]; j++; }
      subjAt = j;
    }
    subject = subject.replace(/\s+/g, ' ').replace(/[.;,\s]+$/, '').trim();
    const flat = lines.slice(Math.max(0, subjAt)).join(' ').replace(/\s+/g, ' ');
    const prot = flat.replace(/\b(No|Nos|Rs|Dr|Sh|Smt|Shri|Dt|dtd|Ref|Sl|Vol|Para|Art|Sec|Govt|Dept|Dy|Asst|Addl|Ltd|etc|viz|St|w\.e\.f|i\.e|e\.g)\./gi, '$1\u0001').replace(/(\d)\.(\d)/g, '$1\u0001$2').replace(/\b([A-Z])\.(?=\s?[A-Z0-9])/g, '$1\u0001');
    const sents = prot.replace(/([.!?])\s+/g, '$1\n').split('\n').map(s => s.replace(/\u0001/g, '.').trim());
    const KW = /\b(shall|hereby|with effect|w\.?e\.?f\.?|revis\w*|amend\w*|standardi[sz]\w*|direct\w*|approv\w*|notif\w*|permit\w*|allowed|entitle\w*|withdraw\w*|supersed\w*|cut-?off|rates?|effective|come into force|clarif\w*|decided|applicable|eligible|admissible|extended|enhanc\w*|increas\w*|reduc\w*|ceiling|limit\w*|per cent|competent authority|sanction\w*)\b|%|\u20b9|\bRs\b/gi;
    const SKIP = /^(sir|madam|yours|copy to|reference|please refer|in this connection|this issues|the undersigned is directed to forward|to,?$|government of india|ministry of|department of|directorate|dak bhawan|f\.?\s?no|no\.?\s?[\w\/-]+\s)/i;
    const lead = /^(?:\d{1,2}[.)]\s*)?(?:I am directed to (?:say|convey|state|inform|refer)(?: that)?,?\s*|It is (?:hereby )?(?:informed|stated|clarified) that\s*)/i;
    const cands = sents.map((s, i) => { s = s.replace(lead, '').trim(); return { s: s.charAt(0).toUpperCase() + s.slice(1), i }; })
      .filter(o => o.s.length >= 40 && o.s.length <= 420 && !SKIP.test(o.s))
      .map(o => ({ ...o, score: (o.s.match(KW) || []).length + (/\d/.test(o.s) ? 1 : 0) + (o.i < 6 ? 0.5 : 0) }))
      .filter(o => o.score >= 1.5);
    const seen = {}, pick = cands.sort((p, q) => q.score - p.score || p.i - q.i).filter(o => { const k = o.s.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 60); if (seen[k]) return false; seen[k] = 1; return true; })
      .slice(0, 5).sort((p, q) => p.i - q.i).map(o => o.s);
    const cut = (s) => { if (s.length <= 320) return s; const k = Math.max(s.lastIndexOf(';', 300), s.lastIndexOf(',', 300)); return (k > 150 ? s.slice(0, k) : s.slice(0, 300).replace(/\s\S*$/, '')) + '.'; };
    const end = (s) => (/[.!?]$/.test(s) ? s : s + '.');
    const eff = /(?:with effect from|w\.?e\.?f\.?|effective from|come into force on)\s+((?:\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4})|(?:\d{1,2}(?:st|nd|rd|th)?\s+[A-Z][a-z]+,?\s+\d{4})|(?:[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}))/i.exec(flat);
    const sup = /\b(supersed\w+|in (?:partial )?modification of|in continuation of)\b[^.]{0,180}/i.exec(flat);
    const out = []; let first = '';
    if (subject) first = end(subject.charAt(0).toUpperCase() + subject.slice(1)); else if (pick.length) first = end(cut(pick.shift()));
    if (!first) return '';
    out.push(first);
    pick.filter(s => s.toLowerCase().indexOf(subject.toLowerCase().slice(0, 40)) < 0 || !subject).slice(0, 4).forEach(s => out.push('- ' + end(cut(s))));
    const body = out.join(' ').toLowerCase();
    if (eff && body.indexOf(eff[1].toLowerCase()) < 0) out.push('- Effective from ' + eff[1] + '.');
    if (sup && body.indexOf(sup[0].toLowerCase().slice(0, 40)) < 0) out.push('- ' + end(cut(sup[0].replace(/\s+/g, ' ').trim().replace(/^./, c => c.toUpperCase()))));
    return out.join('\n');
  }
  // Formatted posts are admin-written HTML. Keep their layout, drop anything that could run code.
  function sanitize(html) {
    try {
      var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
      var root = doc.body.firstChild;
      root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(function (n) { n.remove(); });
      root.querySelectorAll('*').forEach(function (n) {
        Array.prototype.slice.call(n.attributes).forEach(function (a) {
          var name = a.name.toLowerCase(), v = String(a.value || '').trim().toLowerCase();
          if (name.indexOf('on') === 0) n.removeAttribute(a.name);
          else if ((name === 'href' || name === 'src') && v.indexOf('javascript:') === 0) n.removeAttribute(a.name);
        });
        if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); }
      });
      return root.innerHTML;
    } catch (e) { return esc(html); }
  }

  // Cards and rows show the corrected title, department and status, like the app.
  function cardItem(x) {
    var v = C.view(x);
    return { id: x.id, name: v.title, category: v.depts[0] || x.category, date: x.date, status: v.status, omNo: v.omNo };
  }
  function chips() {
    var out = '<div class="chips" role="group" aria-label="Departments">';
    out += '<button class="chip" data-act="cat" data-cat="" aria-pressed="' + (!C.state.cat) + '">All</button>';
    C.state.cats.forEach(function (c) {
      out += '<button class="chip" data-act="cat" data-cat="' + esc(c) + '" aria-pressed="' + (C.state.cat === c) + '">' + esc(c) + '</button>';
    });
    return out + '</div>';
  }
  function list(items, empty) {
    if (!C.state.loaded) return '';
    if (!items.length) return '<p class="empty show">' + esc(empty) + '</p>';
    return '<div class="rack">' + items.map(function (x) { return T.card(cardItem(x), C.isSaved(x.id)); }).join('') + '</div>';
  }
  function status() {
    if (C.state.error && !C.state.loaded) return '<p class="empty show">' + esc(C.state.error) + '</p>';
    if (!C.state.loaded) return '<p class="empty show">Loading rulings…</p>';
    return '';
  }


  // Tools row: the same entry points as the app. Screens not rebuilt yet open in the classic app.
  function toolsRow() {
    var t = function (href, title, sub, ext) {
      return '<a class="tool" href="' + href + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '><b>' + title + '</b><small>' + sub + '</small></a>';
    };
    return '<nav class="tools" aria-label="Tools">' +
      t('index.html', 'CGHS empanelled hospitals', 'Opens in the classic app') +
      t('index.html', 'CGHS package rates', 'Opens in the classic app') +
      t('pay-fixation.html', 'Pay fixation', '7th CPC pay fixation') +
      t('https://postalrulings.blogspot.com/', 'Blog of Postal Rulings', 'Summaries of every ruling', true) +
      t('index.html', 'Ask DakSi', 'Opens in the classic app') +
      t('index.html', 'Admin', 'PIN sign-in in the classic app') +
      '</nav>';
  }
  function iphoneSheet() {
    var wrap = document.createElement('div');
    wrap.className = 'sheet-wrap'; wrap.setAttribute('data-act', 'share-close');
    wrap.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Install on iPhone">' +
      '<h2 class="rsec-h">Install on iPhone</h2><ol>' +
      '<li>Open this page in <b>Safari</b>. Other iPhone browsers cannot add apps to the Home Screen.</li>' +
      '<li>Tap the <b>Share</b> button at the bottom of Safari.</li>' +
      '<li>Choose <b>Add to Home Screen</b>, then tap <b>Add</b>.</li></ol>' +
      '<button class="back sheet-close" data-act="share-close">Close</button></div>';
    document.body.appendChild(wrap);
  }
  // Android: offer the app once, like the classic app's banner. Hidden inside the app itself.
  function downloadBar() {
    var ua = navigator.userAgent || '';
    if (!/Android/i.test(ua) || /PostalRulingsApp/.test(ua)) return;
    try { if (localStorage.getItem('rl_dl_dismissed') === '1') return; } catch (e) {}
    if (document.querySelector('.dlbar')) return;
    var bar = document.createElement('div');
    bar.className = 'dlbar'; bar.setAttribute('role', 'region'); bar.setAttribute('aria-label', 'Get the Android app');
    bar.innerHTML = '<img src="icons/icon-192.png" alt=""><div class="dltxt"><b>Postal Rulings for Android</b>Install the app for quicker access to orders and circulars.</div>' +
      '<a class="pdf" href="https://github.com/uvsubbaiah-spec/postal-rulings/releases/latest/download/postal-rulings.apk" rel="noopener">Download app</a>' +
      '<button class="x" data-act="dl-close" aria-label="Close">×</button>';
    document.body.appendChild(bar);
  }

  function homeView() {
    var cat = C.state.cat, items, heading, more = '';
    if (cat) {
      var all = C.sortedByDate(C.filtered());
      var lim = C.state.limit || 40;
      items = all.slice(0, lim);
      heading = esc(cat) + ' <span class="count">' + all.length + (all.length === 1 ? ' ruling' : ' rulings') + '</span>';
      if (all.length > lim) more = '<button class="more" data-act="more">Show more (' + (all.length - lim) + ' left)</button>';
    } else {
      items = C.sortedByDate(C.state.items).slice(0, 12);
      heading = 'Recently added';
    }
    return T.header() +
      '<label class="sr" for="q">Search rulings</label>' +
      '<input id="q" class="search" type="search" placeholder="Search a subject, OM No. or ruling" value="' + esc(C.state.query) + '" data-act="q">' +
      toolsRow() + chips() + '<h2 class="sec">' + heading + '</h2>' + status() +
      list(items, cat ? 'No rulings in this department yet.' : 'No rulings yet.') + more;
  }
  function searchView() {
    var hits = C.sortedByDate(C.filtered());
    return '<h1 class="page">Search</h1>' +
      '<label class="sr" for="q">Search rulings</label>' +
      '<input id="q" class="search" type="search" placeholder="Search a subject, OM No. or ruling" value="' + esc(C.state.query) + '" data-act="q">' +
      chips() + '<p class="note">' + hits.length + (hits.length === 1 ? ' ruling' : ' rulings') + '</p>' +
      status() + list(hits.slice(0, 80), 'Nothing matches that search.');
  }

  // Saved: compact rows like the app (OM No., status, department, title, date).
  function savedView() {
    var items = C.savedItems();
    var head = '<h1 class="page">Saved</h1><p class="note">Rulings you have bookmarked for quick reference.</p>';
    if (!C.state.loaded) return head + status();
    if (!items.length) return head + '<p class="empty show">Nothing saved yet. Tap Save on any ruling to keep it here.</p>';
    return head + '<div class="srows">' + items.map(function (x) {
      var v = C.view(x);
      return '<article class="srow" data-act="open" data-id="' + esc(x.id) + '" role="button" tabindex="0">' +
        '<div class="srow-top">' + (v.omNo ? '<span class="omno">' + esc(v.omNo) + '</span>' : '') + statusPill(v.status) +
        '<span class="dept">' + esc(v.depts[0] || x.category) + '</span></div>' +
        '<div class="srow-title">' + esc(v.title) + '</div>' +
        '<div class="srow-meta">' + esc(v.issueDate ? 'OM dated ' + fmtDate(v.issueDate) : fmtDate(x.date)) + '</div></article>';
    }).join('') + '</div>';
  }

  function metaGrid(v) {
    var cell = function (k, val) { return '<div class="mcell"><div class="mk">' + k + '</div><div class="mv">' + (val ? esc(val) : '<span class="dash">Not given</span>') + '</div></div>'; };
    return '<div class="mgrid">' + cell('OM No.', v.omNo) + cell('Date issued', v.issueDate ? fmtDate(v.issueDate) : '') +
      cell('Effective from', v.effective ? fmtDate(v.effective) : '') + cell('Status', v.status) + '</div>';
  }
  function readerBody(id, ov) {
    var x = C.state.byId[id] || { id: id, name: 'Ruling', category: '', date: '' };
    var v = C.view(x);
    if (ov) {
      ['title', 'omNo', 'issueDate', 'effective', 'status', 'summary', 'amend', 'blogUrl'].forEach(function (k) { if (ov[k]) v[k] = ov[k]; });
      if (ov.depts && ov.depts.length) v.depts = ov.depts;
      if (ov.chain) v.chain = ov.chain;
    }
    var h = '';
    h += '<div class="rhead">' + statusPill(v.status) + '<span class="dept">' + esc(v.depts.join(' · ')) + '</span></div>';
    h += '<h1 class="page rtitle">' + (ov && ov.titleHtml ? sanitize(ov.titleHtml) : esc(v.title)) + '</h1>';
    h += '<p class="note">Added ' + esc(fmtDate(x.date)) + '</p>';
    h += '<div class="ractions">';
    if (v.url) h += '<a class="pdf" href="' + esc(v.url) + '" target="_blank" rel="noopener">Download PDF</a>';
    if (v.blogUrl) h += '<a class="pdf ghost" href="' + esc(v.blogUrl) + '" target="_blank" rel="noopener">Read on the blog</a>';
    h += '</div>';
    h += metaGrid(v);
    var sum = ov && ov.summaryHtml ? sanitize(ov.summaryHtml) : (v.summary ? esc(v.summary) : '');
    var cachedSum = !sum && C.state.sums && C.state.sums[id];
    h += '<section class="rsec"><h2 class="rsec-h">Summary <span class="sumlabel" id="sumlabel">' + (sum ? 'Edited' : cachedSum ? esc(cachedSum.label) : '') + '</span></h2><div id="sumbody" data-id="' + esc(id) + '" data-edited="' + (sum ? '1' : '') + '">' +
      (sum ? '<div class="sumbox">' + sum + '</div>' : cachedSum ? sumHtml(cachedSum.text) : '<p class="muted">Preparing a summary…</p>') + '</div></section>';
    h += '<section class="rsec"><h2 class="rsec-h">Document text</h2><div id="docbody">';
    if (ov && ov.html) h += '<div class="docbox">' + sanitize(ov.html) + '</div>';
    else if (ov && ov.text) h += '<pre class="doc">' + esc(ov.text) + '</pre>';
    else h += '<p class="muted">Loading text…</p>';
    h += '</div></section>';
    if (v.amend) h += '<section class="rsec"><h2 class="rsec-h">Amendment note</h2><div class="amend">' + esc(v.amend) + '</div></section>';
    var chain = (v.chain || []).filter(function (cid) { return cid && cid !== id; });
    if (chain.length) {
      h += '<section class="rsec"><h2 class="rsec-h">Amendment history</h2><div class="srows">' + chain.map(function (cid) {
        var cx = C.state.byId[cid]; if (!cx) return '';
        var cv = C.view(cx);
        return '<article class="srow" data-act="open" data-id="' + esc(cid) + '" role="button" tabindex="0"><div class="srow-top">' +
          (cv.omNo ? '<span class="omno">' + esc(cv.omNo) + '</span>' : '') + statusPill(cv.status) + '</div><div class="srow-title">' + esc(cv.title) + '</div>' +
          '<div class="srow-meta">' + esc(fmtDate(cx.date)) + '</div></article>';
      }).join('') + '</div></section>';
    }
    return h;
  }

  // "First line" then "- point" lines, as the app shows them.
  function sumHtml(t) {
    var lines = String(t || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    if (!lines.length) return '';
    var first = [], pts = [];
    lines.forEach(function (l) { if (/^-\s+/.test(l)) pts.push(l.replace(/^-\s+/, '')); else first.push(l); });
    return '<div class="sumbox">' + (first.length ? '<p>' + esc(first.join(' ')) + '</p>' : '') +
      (pts.length ? '<ul>' + pts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }
  function plainOf(html) { try { var d = new DOMParser().parseFromString(html, 'text/html'); d.querySelectorAll('br,p,div,li,tr,h1,h2,h3').forEach(function (n) { n.appendChild(d.createTextNode('\n')); }); return d.body.textContent || ''; } catch (e) { return ''; } }
  function setSummary(id, text, label) {
    C.state.sums = C.state.sums || {}; C.state.sums[id] = { text: text, label: label };
    var b = document.getElementById('sumbody'), l = document.getElementById('sumlabel');
    if (!b || b.getAttribute('data-edited') === '1' || b.getAttribute('data-id') !== id) return;
    b.innerHTML = sumHtml(text); if (l) l.textContent = label;
  }
  // No admin summary: build one from the text, else ask the backend (cached there), like the app.
  function fillSummary(id, plain) {
    var b = document.getElementById('sumbody');
    if (!b || b.getAttribute('data-edited') === '1') return;
    if (C.state.sums && C.state.sums[id]) return;
    var local = '';
    try { local = localSummary(plain); } catch (e) {}
    if (local) { setSummary(id, local, 'Auto-generated'); return; }
    var ep = (window.RL_CONFIG && window.RL_CONFIG.endpoint) || '';
    var none = function () { var bb = document.getElementById('sumbody'); if (bb && bb.getAttribute('data-id') === id && !(C.state.sums && C.state.sums[id])) bb.innerHTML = '<p class="muted">No summary is available for this ruling yet.</p>'; };
    if (!ep || !String(plain || '').trim()) { none(); return; }
    fetch(ep, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'postSummary', id: id, text: String(plain).slice(0, 40000) }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && d.summary) setSummary(id, d.summary, 'AI summary'); else none(); })
      .catch(none);
  }
  function fillText(id) {
    C.loadText(id).then(function (t) {
      var el = document.getElementById('docbody'); if (!el || el.getAttribute('data-done')) return;
      var known = C.state.byId[id];
      if (t && t.html) el.innerHTML = '<div class="docbox">' + sanitize(t.html) + '</div>';
      else if (t && t.text) el.innerHTML = '<pre class="doc">' + esc(t.text) + '</pre>';
      else if (known && known.text) el.innerHTML = '<pre class="doc">' + esc(known.text) + '</pre>';
      else el.innerHTML = '<p class="muted">' + (t && t.pending ? 'This document is still being prepared. Open it again in a minute, or use Download PDF.' : 'The text of this ruling is not available yet. Use Download PDF above.') + '</p>';
      var cand = [(t && t.text) || '', (t && t.html ? plainOf(t.html) : ''), (known && known.text) || ''].sort(function (a, b) { return b.length - a.length; });
      fillSummary(id, cand[0]);
    }).catch(function () {
      var el = document.getElementById('docbody'); if (!el) return;
      var known = C.state.byId[id];
      el.innerHTML = known && known.text ? '<pre class="doc">' + esc(known.text) + '</pre>' : '<p class="muted">The text is taking too long to load. Use Download PDF above, or try again.</p>';
      fillSummary(id, (known && known.text) || '');
    });
  }

  function readView(id) {
    var cached = C.state.ovFull && C.state.ovFull[id];
    var html = '<div class="topbar"><button class="back" data-act="back">Back</button><div class="tb-right">' +
      '<button class="save share" data-act="share" data-id="' + esc(id) + '">Share</button>' +
      '<button class="save" data-act="save" data-id="' + esc(id) + '" aria-pressed="' + C.isSaved(id) + '">' + (C.isSaved(id) ? 'Saved' : 'Save') + '</button></div></div>' +
      '<div id="rbody">' + readerBody(id, cached) + '</div>';
    var seq = (readView.seq = (readView.seq || 0) + 1);
    if (!(cached && (cached.html || cached.text))) fillText(id);
    else setTimeout(function () { fillSummary(id, cached.text || plainOf(cached.html)); }, 0);
    C.loadOv(id).then(function (ov) {
      if (seq !== readView.seq || !ov) return;
      var rb = document.getElementById('rbody'); if (!rb) return;
      rb.innerHTML = readerBody(id, ov);
      if (ov.html || ov.text) { var d = document.getElementById('docbody'); if (d) d.setAttribute('data-done', '1'); fillSummary(id, ov.text || plainOf(ov.html)); }
      else fillText(id);
    }).catch(function () {});
    return html;
  }

  // Share: the phone's own share panel where it works, otherwise the app-style panel.
  function shareUrl(id) { return location.origin + location.pathname + '?doc=' + encodeURIComponent(id); }
  function openShare(id) {
    var x = C.state.byId[id]; var title = x ? C.view(x).title : 'Postal ruling'; var url = shareUrl(id);
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
    if (mobile && navigator.share) { navigator.share({ title: title, text: title, url: url }).catch(function () {}); return; }
    var wrap = document.createElement('div');
    wrap.className = 'sheet-wrap'; wrap.setAttribute('data-act', 'share-close');
    wrap.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Share this ruling">' +
      '<h2 class="rsec-h">Share this ruling</h2><p class="sheet-title">' + esc(title) + '</p>' +
      '<label class="sr" for="share-url">Link</label><input id="share-url" class="search" readonly value="' + esc(url) + '">' +
      '<div class="sheet-btns"><button class="pdf" data-act="share-copy">Copy link</button>' +
      '<a class="pdf ghost" href="https://wa.me/?text=' + encodeURIComponent(title + '\n' + url) + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '<a class="pdf ghost" href="mailto:?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(title + '\n\n' + url) + '">Email</a></div>' +
      '<button class="back sheet-close" data-act="share-close">Close</button></div>';
    document.body.appendChild(wrap);
    var inp = document.getElementById('share-url'); if (inp) inp.select();
  }

  function render() {
    var r = (location.hash || '#home').replace(/^#/, '');
    var view, route = 'home';
    if (r.indexOf('read/') === 0) { route = 'read'; view = readView(decodeURIComponent(r.slice(5))); }
    else if (r === 'search') { route = 'search'; view = searchView(); }
    else if (r === 'saved') { route = 'saved'; view = savedView(); }
    else view = homeView();
    app.innerHTML = '<main class="wrap">' + view + '</main>' + T.nav(route === 'read' ? '' : route);
    document.body.setAttribute('data-route', route);
    var on = document.querySelector('.chip[aria-pressed="true"]');
    if (on && on.scrollIntoView && route !== 'read') on.scrollIntoView({ block: 'nearest', inline: 'center' });
    var q = document.getElementById('q');
    if (q && r === 'search') { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    if (route === 'read') window.scrollTo(0, 0);
  }
  // Re-render lists when data arrives, but never rebuild an open reader (it updates itself).
  function refresh() { if ((location.hash || '').indexOf('#read/') !== 0) render(); }

  var typing = null;
  document.addEventListener('input', function (e) {
    if (e.target && e.target.getAttribute('data-act') === 'q') {
      C.state.query = e.target.value;
      clearTimeout(typing);
      typing = setTimeout(function () {
        var r = (location.hash || '#home').replace(/^#/, '');
        if (r === 'home' || r === '' || r === 'search') {
          if (r !== 'search' && C.state.query.trim()) go('#search');
          else render();
        }
      }, 180);
    }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('data-act') === 'open') { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape') { var w = document.querySelector('.sheet-wrap'); if (w) w.remove(); }
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'share-close') { if (e.target === el || el.classList.contains('sheet-close')) { var w = document.querySelector('.sheet-wrap'); if (w) w.remove(); } return; }
    if (act === 'share-copy') {
      var inp = document.getElementById('share-url'); var u = inp ? inp.value : '';
      var done = function () { el.textContent = 'Copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done).catch(function () { if (inp) inp.select(); });
      else if (inp) { inp.select(); try { document.execCommand('copy'); done(); } catch (x) {} }
      return;
    }
    if (act === 'open') { go('#read/' + encodeURIComponent(el.getAttribute('data-id'))); }
    else if (act === 'cat') { C.state.cat = el.getAttribute('data-cat') || ''; C.state.limit = 40; render(); var h = document.querySelector('.sec'); if (h && h.scrollIntoView) h.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    else if (act === 'more') { C.state.limit = (C.state.limit || 40) + 40; render(); }
    else if (act === 'back') { history.length > 1 ? history.back() : go('#home'); }
    else if (act === 'save') {
      var id = el.getAttribute('data-id'); C.toggleSaved(id);
      el.setAttribute('aria-pressed', String(C.isSaved(id))); el.textContent = C.isSaved(id) ? 'Saved' : 'Save';
    }
    else if (act === 'share') { openShare(el.getAttribute('data-id')); }
    else if (act === 'iphone') { iphoneSheet(); }
    else if (act === 'dl-close') { try { localStorage.setItem('rl_dl_dismissed', '1'); } catch (x) {} var b = document.querySelector('.dlbar'); if (b) b.remove(); }
  });
  window.addEventListener('hashchange', render);

  // Links shared from the app (?doc=ID) open that ruling here too.
  try {
    var want = new URLSearchParams(location.search).get('doc');
    if (want) { history.replaceState(null, '', location.pathname + '#read/' + encodeURIComponent(want)); }
  } catch (e) {}

  // App version for the Get App button, from the same file the classic app uses.
  window.RL_VERSION = window.RL_VERSION || '1.0.11';
  fetch('app-version.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.version) { window.RL_VERSION = d.version; document.querySelectorAll('.hbtn .ver').forEach(function (n) { n.textContent = 'v' + d.version; }); }
  }).catch(function () {});
  C.loadSaved();
  render();
  setTimeout(downloadBar, 1500);
  C.loadIndex(refresh);
  C.loadOverrides(refresh);
})();

</script>
</body>
</html>
