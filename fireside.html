<style>

.dk-srcs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dk-src{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit}

.dk-ask{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px 0;background:var(--paper)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.tablewrap{overflow-x:auto;border-radius:12px;box-shadow:var(--shadow);background:var(--card)}

.hbtn{border-color:#4A3A30}
.lamp .logo{width:72px;height:72px;margin:0}
.lamp .hbtns{justify-content:center}
.seal{font-size:11px}

<script>

  // Same summary the app writes when no admin summary exists (copied from the app).
  function localSummary(raw) {
    const lines = String(raw || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(x => x.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
    if (lines.join('').length < 80) return '';
    let subject = '', subjAt = -1;
    for (let i = 0; i < lines.length && subjAt < 0; i++) {
      const m = /^sub(?:ject)?\s*[:\-\u2013.]\s*(.*)$/i.exec(lines[i]); if (!m) continue;
      subject = m[1]; subjAt = i; let j = i + 1;
      while (j < lines.length && subject.length < 400 && !/[.]$/.test(subject) && lines[j].length < 170 && !/^(sir|madam|i am directed|the undersigned|please refer|reference|ref\b|\d+[.)]\s)/i.test(lines[j])) { subject += ' ' + lines[j]; j++; }
      subjAt = j;
    }
    subject = subject.replace(/\s+/g, ' ').replace(/[.;,\s]+$/, '').trim();
    const flat = lines.slice(Math.max(0, subjAt)).join(' ').replace(/\s+/g, ' ');
    const prot = flat.replace(/\b(No|Nos|Rs|Dr|Sh|Smt|Shri|Dt|dtd|Ref|Sl|Vol|Para|Art|Sec|Govt|Dept|Dy|Asst|Addl|Ltd|etc|viz|St|w\.e\.f|i\.e|e\.g)\./gi, '$1\u0001').replace(/(\d)\.(\d)/g, '$1\u0001$2').replace(/\b([A-Z])\.(?=\s?[A-Z0-9])/g, '$1\u0001');
    const sents = prot.replace(/([.!?])\s+/g, '$1\n').split('\n').map(s => s.replace(/\u0001/g, '.').trim());
    const KW = /\b(shall|hereby|with effect|w\.?e\.?f\.?|revis\w*|amend\w*|standardi[sz]\w*|direct\w*|approv\w*|notif\w*|permit\w*|allowed|entitle\w*|withdraw\w*|supersed\w*|cut-?off|rates?|effective|come into force|clarif\w*|decided|applicable|eligible|admissible|extended|enhanc\w*|increas\w*|reduc\w*|ceiling|limit\w*|per cent|competent authority|sanction\w*)\b|%|\u20b9|\bRs\b/gi;
    const SKIP = /^(sir|madam|yours|copy to|reference|please refer|in this connection|this issues|the undersigned is directed to forward|to,?$|government of india|ministry of|department of|directorate|dak bhawan|f\.?\s?no|no\.?\s?[\w\/-]+\s)/i;
    const lead = /^(?:\d{1,2}[.)]\s*)?(?:I am directed to (?:say|convey|state|inform|refer)(?: that)?,?\s*|It is (?:hereby )?(?:informed|stated|clarified) that\s*)/i;
    const cands = sents.map((s, i) => { s = s.replace(lead, '').trim(); return { s: s.charAt(0).toUpperCase() + s.slice(1), i }; })
      .filter(o => o.s.length >= 40 && o.s.length <= 420 && !SKIP.test(o.s))
      .map(o => ({ ...o, score: (o.s.match(KW) || []).length + (/\d/.test(o.s) ? 1 : 0) + (o.i < 6 ? 0.5 : 0) }))
      .filter(o => o.score >= 1.5);
    const seen = {}, pick = cands.sort((p, q) => q.score - p.score || p.i - q.i).filter(o => { const k = o.s.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 60); if (seen[k]) return false; seen[k] = 1; return true; })
      .slice(0, 5).sort((p, q) => p.i - q.i).map(o => o.s);
    const cut = (s) => { if (s.length <= 320) return s; const k = Math.max(s.lastIndexOf(';', 300), s.lastIndexOf(',', 300)); return (k > 150 ? s.slice(0, k) : s.slice(0, 300).replace(/\s\S*$/, '')) + '.'; };
    const end = (s) => (/[.!?]$/.test(s) ? s : s + '.');
    const eff = /(?:with effect from|w\.?e\.?f\.?|effective from|come into force on)\s+((?:\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4})|(?:\d{1,2}(?:st|nd|rd|th)?\s+[A-Z][a-z]+,?\s+\d{4})|(?:[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}))/i.exec(flat);
    const sup = /\b(supersed\w+|in (?:partial )?modification of|in continuation of)\b[^.]{0,180}/i.exec(flat);
    const out = []; let first = '';
    if (subject) first = end(subject.charAt(0).toUpperCase() + subject.slice(1)); else if (pick.length) first = end(cut(pick.shift()));
    if (!first) return '';
    out.push(first);
    pick.filter(s => s.toLowerCase().indexOf(subject.toLowerCase().slice(0, 40)) < 0 || !subject).slice(0, 4).forEach(s => out.push('- ' + end(cut(s))));
    const body = out.join(' ').toLowerCase();
    if (eff && body.indexOf(eff[1].toLowerCase()) < 0) out.push('- Effective from ' + eff[1] + '.');
    if (sup && body.indexOf(sup[0].toLowerCase().slice(0, 40)) < 0) out.push('- ' + end(cut(sup[0].replace(/\s+/g, ' ').trim().replace(/^./, c => c.toUpperCase()))));
    return out.join('\n');
  }

      root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(function (n) { n.remove(); });

        Array.prototype.slice.call(n.attributes).forEach(function (a) {

  }

  function readerBody(id, ov) {

  // "First line" then "- point" lines, as the app shows them.
  function sumHtml(t) {
    var lines = String(t || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    if (!lines.length) return '';
    var first = [], pts = [];
    lines.forEach(function (l) { if (/^-\s+/.test(l)) pts.push(l.replace(/^-\s+/, '')); else first.push(l); });
    return '<div class="sumbox">' + (first.length ? '<p>' + esc(first.join(' ')) + '</p>' : '') +
      (pts.length ? '<ul>' + pts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }
  function plainOf(html) { try { var d = new DOMParser().parseFromString(html, 'text/html'); d.querySelectorAll('br,p,div,li,tr,h1,h2,h3').forEach(function (n) { n.appendChild(d.createTextNode('\n')); }); return d.body.textContent || ''; } catch (e) { return ''; } }
  function setSummary(id, text, label) {
    C.state.sums = C.state.sums || {}; C.state.sums[id] = { text: text, label: label };
    var b = document.getElementById('sumbody'), l = document.getElementById('sumlabel');
    if (!b || b.getAttribute('data-edited') === '1' || b.getAttribute('data-id') !== id) return;
    b.innerHTML = sumHtml(text); if (l) l.textContent = label;

  // No admin summary: build one from the text, else ask the backend (cached there), like the app.
  function fillSummary(id, plain) {
    var b = document.getElementById('sumbody');
    if (!b || b.getAttribute('data-edited') === '1') return;
    if (C.state.sums && C.state.sums[id]) return;
    var local = '';
    try { local = localSummary(plain); } catch (e) {}
    if (local) { setSummary(id, local, 'Auto-generated'); return; }
    var ep = (window.RL_CONFIG && window.RL_CONFIG.endpoint) || '';
    var none = function () { var bb = document.getElementById('sumbody'); if (bb && bb.getAttribute('data-id') === id && !(C.state.sums && C.state.sums[id])) bb.innerHTML = '<p class="muted">No summary is available for this ruling yet.</p>'; };
    if (!ep || !String(plain || '').trim()) { none(); return; }
    fetch(ep, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'postSummary', id: id, text: String(plain).slice(0, 40000) }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && d.summary) setSummary(id, d.summary, 'AI summary'); else none(); })
      .catch(none);
  }
  function fillText(id) {
    C.loadText(id).then(function (t) {
      var el = document.getElementById('docbody'); if (!el || el.getAttribute('data-done')) return;

      if (t && t.html) el.innerHTML = '<div class="docbox">' + sanitize(t.html) + '</div>';
      else if (t && t.text) el.innerHTML = '<pre class="doc">' + esc(t.text) + '</pre>';
      else if (known && known.text) el.innerHTML = '<pre class="doc">' + esc(known.text) + '</pre>';
      else el.innerHTML = '<p class="muted">' + (t && t.pending ? 'This document is still being prepared. Open it again in a minute, or use Download PDF.' : 'The text of this ruling is not available yet. Use Download PDF above.') + '</p>';
      var cand = [(t && t.text) || '', (t && t.html ? plainOf(t.html) : ''), (known && known.text) || ''].sort(function (a, b) { return b.length - a.length; });
      fillSummary(id, cand[0]);
    }).catch(function () {
      var el = document.getElementById('docbody'); if (!el) return;
      var known = C.state.byId[id];
      el.innerHTML = known && known.text ? '<pre class="doc">' + esc(known.text) + '</pre>' : '<p class="muted">The text is taking too long to load. Use Download PDF above, or try again.</p>';

  // ===== Departments, Summary table, Alerts, CGHS hospitals, CGHS package rates =====
  function ago(ms) {
    var s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    if (s < 86400 * 2) return 'Yesterday';
    return Math.round(s / 86400) + ' days ago';
  }

    if (!C.state.loaded) return h;

      return '<button class="dcell" data-act="fav" data-cat="' + esc(c) + '"><b>' + esc(c) + '</b><small>' + counts[c] + (counts[c] === 1 ? ' ruling' : ' rulings') + '</small></button>';

  // Summary: the app's table of every ruling (title, OM No., dates, status, department, summary).
  var SUM = { cat: '', sort: 'date', dir: -1, cap: 100, q: '' };
  function summaryRows() {

      return { id: x.id, t: v.title, om: v.omNo, d: v.issueDate || x.date, e: v.effective, s: v.status || 'Active', c: v.depts.join(', '), m: v.summary };

    var key = { date: 'd', title: 't', om: 'om', eff: 'e', status: 's', dept: 'c' }[SUM.sort] || 'd';

  function summaryView() {

    var th = function (k, label) { return '<th scope="col"><button class="th" data-act="sumsort" data-k="' + k + '">' + label + (SUM.sort === k ? (SUM.dir > 0 ? ' ▲' : ' ▼') : '') + '</button></th>'; };
    h += '<p class="note">' + rows.length + (rows.length === 1 ? ' ruling' : ' rulings') + '</p><div class="tablewrap"><table class="sumtable"><thead><tr>' +
      th('title', 'Title') + th('om', 'OM No.') + th('date', 'OM Date') + th('eff', 'Effective') + th('status', 'Status') + th('dept', 'Dept.') + '<th scope="col">Summary</th></tr></thead><tbody>' +

  // Alerts: newly added rulings and rulings the administrator has corrected, newest first.
  function alertsView() {

    if (!C.state.loaded) return h;

    list.sort(function (a, b) { return b.t - a.t; });

        '<div class="srow-title">' + esc(v.title) + '</div><div class="srow-meta">' + esc(a.t ? ago(a.t) : '') + '</div></article>';

  // ---- CGHS data (same backend calls as the app) ----
  var CG = { hosp: null, hospBusy: false, hospErr: '', rates: null, ratesBusy: false, ratesErr: '' };
  function postEp(action, extra) {
    var url = ep(); if (!url) return Promise.reject(new Error('Not connected to the rulings server.'));
    var body = { action: action }; Object.keys(extra || {}).forEach(function (k) { body[k] = extra[k]; });
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.text(); }).then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('the server sent an error page'); } });
  }
  function allPages(action) {
    var part = function (page) {
      var tryN = 0;
      var once = function () { return postEp(action, { page: page }).then(function (r) { if (r && r.ok) return r; throw new Error((r && r.error) || 'no reply'); })
        .catch(function (e) { if (++tryN >= 3) throw e; return new Promise(function (res) { setTimeout(res, 800 * tryN); }).then(once); }); };
      return once();
    };
    return part(0).then(function (first) {
      var pages = first.pages || 1, reqs = [];
      for (var i = 1; i < pages; i++) reqs.push(part(i));
      return Promise.all(reqs).then(function (rest) { return [first].concat(rest); });
    });
  }
  function cacheGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function cachePut(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function loadHosp() {
    if (CG.hosp || CG.hospBusy) return;
    var c = cacheGet('rl_cghs_hosp_v2'); if (c && c.rows) CG.hosp = c.rows;
    CG.hospBusy = true;
    allPages('cghsList').then(function (parts) {
      var rows = []; parts.forEach(function (p) { rows = rows.concat(p.rows || []); });
      if (rows.length) { CG.hosp = rows; cachePut('rl_cghs_hosp_v2', { at: parts[0].at, rows: rows }); }
    }).catch(function (e) { if (!CG.hosp) CG.hospErr = 'Could not load the hospital list (' + String(e.message || e).slice(0, 80) + '). Check your connection and try again.'; })
      .then(function () { CG.hospBusy = false; var r = (location.hash || '').replace('#', ''); if (r === 'cghs' || r === 'rates') render(); });
  }
  function loadRates() {
    if (CG.rates || CG.ratesBusy) return;
    var c = cacheGet('rl_cghs_rates_v2'); if (c && c.items) CG.rates = c;
    CG.ratesBusy = true;
    allPages('cghsRates').then(function (parts) {
      var items = []; parts.forEach(function (p) { items = items.concat(p.items || []); });
      if (items.length) { CG.rates = { cols: parts[0].cols || [], items: items, at: parts[0].at }; cachePut('rl_cghs_rates_v2', CG.rates); }
    }).catch(function (e) { if (!CG.rates) CG.ratesErr = 'Could not load the rate list (' + String(e.message || e).slice(0, 80) + '). Check your connection and try again.'; })
      .then(function () { CG.ratesBusy = false; if ((location.hash || '') === '#rates') render(); });
  }
  // Hospital row: [id, name, category, address, city/state, phone, specialities, from, to, validity, status, map, NABH cert, NABL cert]
  function hRec(r) { return { id: r[0], n: r[1], a: r[2], ad: r[3], cs: r[4], ph: r[5], sp: r[6], f: r[7], t: r[8], v: r[9], st: r[10], m: r[11], nabh: r[12], nabl: r[13] }; }
  function cityOf(cs) { var p = String(cs || '').split(','); return p.length > 1 ? p.slice(0, -1).join(',').trim() : String(cs || '').trim(); }
  function stateOf(cs) { var p = String(cs || '').split(','); return p.length > 1 ? p[p.length - 1].trim() : ''; }
  function certLink(c, label) {
    var u = Array.isArray(c) ? c.filter(function (x) { return /^https?:/.test(String(x)); })[0] : (/^https?:/.test(String(c || '')) ? c : '');
    return u ? '<a class="hlink" href="' + esc(u) + '" target="_blank" rel="noopener">' + label + ' certificate</a>' : '';
  }

  var HS = { state: '', city: '', acc: '', q: '', show: 30 };
  function cghsView() {
    loadHosp();
    var h = '<div class="topbar"><button class="back" data-act="back">Back</button></div><h1 class="page">CGHS empanelled hospitals</h1>' +
      '<p class="note">From the CGHS site\'s own hospital list, refreshed every night.</p>';
    if (!CG.hosp) return h + '<p class="empty show">' + esc(CG.hospErr || 'Loading hospitals…') + '</p>';
    var recs = CG.hosp.map(hRec);
    var states = {}, cities = {}, accs = {};
    recs.forEach(function (r) { var s = stateOf(r.cs); if (s) states[s] = 1; if (!HS.state || s === HS.state) { var c = cityOf(r.cs); if (c) cities[c] = 1; } if (r.a) accs[r.a] = 1; });
    var q = HS.q.toLowerCase().trim();
    var hits = recs.filter(function (r) {
      if (HS.state && stateOf(r.cs) !== HS.state) return false;
      if (HS.city && cityOf(r.cs) !== HS.city) return false;
      if (HS.acc && r.a !== HS.acc) return false;
      return !q || (r.n + ' ' + r.ad + ' ' + r.sp + ' ' + r.cs).toLowerCase().indexOf(q) >= 0;
    });
    var sel = function (id, act, label, val, opts) {
      return '<label class="fl"><span>' + label + '</span><select id="' + id + '" data-act="' + act + '"><option value="">All</option>' +
        opts.sort().map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>';
    };
    h += '<div class="filters">' + sel('hsState', 'hs-state', 'State', HS.state, Object.keys(states)) + sel('hsCity', 'hs-city', 'City', HS.city, Object.keys(cities)) +
      sel('hsAcc', 'hs-acc', 'Accreditation', HS.acc, Object.keys(accs)) + '</div>' +
      '<label class="sr" for="hsq">Search hospitals</label><input id="hsq" class="search" type="search" data-act="hsq" placeholder="Search hospital, area or speciality" value="' + esc(HS.q) + '">' +
      '<p class="note">' + hits.length + (hits.length === 1 ? ' hospital' : ' hospitals') + (CG.hospBusy ? ' · updating…' : '') + '</p>';

    else if (act === 'id-later') { try { localStorage.setItem('rl_idasked', '1'); } catch (x) {} closeSheet(); visitPing(); }
    else if (act === 'signout') { C.signOut(); render(); idSheet(); }
    else if (act === 'fav') { C.state.cat = el.getAttribute('data-cat') || ''; C.state.limit = 40; go('#home'); }
    else if (act === 'theme') { var k = el.getAttribute('data-theme'); try { localStorage.setItem('rl_front', k); } catch (x) {} if (k !== currentTheme()) location.href = PAGES[k].href; }
    else if (act === 'dl-close') { try { localStorage.setItem('rl_dl_dismissed', '1'); } catch (x) {} var b = document.querySelector('.dlbar'); if (b) b.remove(); }
  });
  document.addEventListener('change', function (e) { if (e.target && e.target.getAttribute) screens2Change(e.target.getAttribute('data-act'), e.target); });
  window.addEventListener('hashchange', render);

  // Links shared from the app (?doc=ID) open that ruling here too.
  try {
    var want = new URLSearchParams(location.search).get('doc');
    if (want) { history.replaceState(null, '', location.pathname + '#read/' + encodeURIComponent(want)); }
  } catch (e) {}

  // App version for the Get App button, from the same file the classic app uses.
  window.RL_VERSION = window.RL_VERSION || '1.0.11';
  fetch('app-version.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.version) { window.RL_VERSION = d.version; document.querySelectorAll('.hbtn .ver').forEach(function (n) { n.textContent = 'v' + d.version; }); }
  }).catch(function () {});
  C.loadSaved();
  render();
  setTimeout(downloadBar, 1500);
  setTimeout(function () { var p = C.profile(), asked = ''; try { asked = localStorage.getItem('rl_idasked') || ''; } catch (e) {}
    if (!(p.name || p.mobile || p.email) && !asked && (location.hash || '').indexOf('#read/') !== 0) idSheet(); }, 1200);
  visitPing();
  setInterval(visitPing, 90000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') visitPing(true); });
  window.addEventListener('pagehide', function () { visitPing(true); });
  try { if (navigator.permissions && navigator.geolocation) navigator.permissions.query({ name: 'geolocation' }).then(function (st) { if (st.state === 'granted') navigator.geolocation.getCurrentPosition(function (pp) { visit.geo = { lat: +pp.coords.latitude.toFixed(6), lng: +pp.coords.longitude.toFixed(6), acc: Math.round(pp.coords.accuracy || 0) }; visitPing(); }, function () {}, { timeout: 9000, maximumAge: 300000 }); }).catch(function () {}); } catch (e) {}
  C.loadIndex(refresh);
  C.loadOverrides(refresh);
})();

</script>
</body>
