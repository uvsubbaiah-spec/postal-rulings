html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
#view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
#view.is-fixed{overflow:hidden}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:flex;flex-direction:column;gap:22px;padding-block:18px 28px}

/* headings */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.apptitle{margin:0;font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.1;color:var(--title)}
.appsub{margin:0;font-size:14px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{margin:0;font-family:var(--font-head);font-weight:400;font-size:18px;line-height:1.4}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.note{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}

.iconbtn{width:46px;height:46px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);text-decoration:none}
.ghostbtn{width:44px;height:44px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:var(--ink);text-decoration:none;padding:0}

/* hero */
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:24px;background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 1px rgba(242,169,59,.45),0 12px 28px rgba(110,31,31,.25)}
.hero-top{display:flex;justify-content:space-between;gap:16px}
.hero-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.badge{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gold);color:#2A1F17}
.hero h2{margin:4px 0 0;font-family:var(--font-head);font-weight:400;font-size:23px;line-height:1.35}
.hero p{margin:0;font-size:14px;color:var(--hero-sub)}
.minigrid{flex-shrink:0;align-self:flex-start;display:grid;grid-template-columns:repeat(7,12px);gap:2px;padding:4px;border-radius:10px;background:var(--hero-deep);transform:rotate(4deg)}
.minigrid span{width:12px;height:12px;border-radius:1px;background:#FFF6E8}
.minigrid span.on{background:var(--gold)}
.minigrid span.mb{background:var(--block) url(rain.webp) center/cover}
body.no-rain .minigrid span.mb{background-image:none}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--hero-sub)}
.bar{height:8px;border-radius:999px;background:var(--hero-deep);overflow:hidden}
.bar i{display:block;height:8px;border-radius:999px;background:var(--gold)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;border-radius:14px;background:var(--gold);color:#2A1F17;font-size:16px;font-weight:700;text-decoration:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.muggu{position:absolute;right:-44px;bottom:-48px;opacity:.22;pointer-events:none}
.hero > :not(.muggu){position:relative}

/* lists and cards */
.card{display:flex;flex-direction:column;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.rowlink{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;color:var(--ink);text-decoration:none;border:0;background:transparent;width:100%;text-align:left}
.rowlink + .rowlink{border-top:1px dashed var(--line)}
.rowlink .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rowlink .t b{font-size:16px;font-weight:600;line-height:1.4}
.rowlink .t small{font-size:13px;color:var(--muted)}
.tile{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--leaf-tint);color:var(--leaf-ink)}
.pill{flex-shrink:0;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.mid{background:var(--gold-tint);color:var(--pill-ink)}
.pill.ok{background:var(--leaf-tint);color:var(--leaf-ink)}
.pill.new{background:var(--chip);color:var(--ink)}
.chips{display:flex;gap:10px;overflow-x:auto;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px)) 6px}
.mchip{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;min-width:108px;padding:12px 14px;border-radius:18px;color:var(--ink);text-decoration:none}
.mchip b{font-size:15px;font-weight:700}
.mchip small{font-size:13px;color:var(--muted)}
.mchip:nth-child(3n+1){background:var(--gold-tint)}
.mchip:nth-child(3n+2){background:var(--rose)}
.mchip:nth-child(3n){background:var(--leaf-tint)}
.tip{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--rose)}
.tip p{margin:0;font-size:14px;line-height:1.55}
.tip .ic{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--primary);color:var(--on-primary)}
.search{display:flex;flex-direction:column;gap:6px}
.search label{font-size:13px;font-weight:600;color:var(--muted)}
.search .box{display:flex;align-items:center;gap:8px;height:50px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;height:46px;border:0;background:transparent;outline:none;font-size:16px}

/* tab bar */
#tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px 8px;background:var(--surface);border-top:1px solid var(--line)}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
#tabs a span{display:flex;align-items:center;justify-content:center;width:60px;height:32px;border-radius:999px}
#tabs a[aria-current="page"]{color:var(--primary);font-weight:700}
#tabs a[aria-current="page"] span{background:var(--gold-tint)}

/* puzzle screen */
.play{flex:1;min-height:0;display:flex;flex-direction:column}
.pbar{flex-shrink:0;display:flex;align-items:center;gap:2px;height:56px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pbar .t{flex:1;min-width:0}
.pbar h1{margin:0;font-family:var(--font-head);font-weight:400;font-size:17px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar p{margin:0;font-size:12px;line-height:1.3;color:var(--muted)}
.ptools{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;height:54px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:999px;background:var(--chip)}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}
.seg.wide button{min-height:42px}
.timer{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{display:flex;align-items:center;gap:4px;height:44px;padding:0 14px 0 4px;border:0;border-radius:999px;background:var(--pill-bg);color:var(--pill-ink);font-size:14px;font-weight:700}
.pmid{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.grid{--gw:min(calc(100vw - 32px),460px,max(250px,calc(100dvh - 520px)));width:var(--gw);max-width:100%;margin-inline:auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;padding:2px;border-radius:10px;overflow:hidden;background:var(--grid-line);box-shadow:var(--shadow)}
.cell{position:relative;aspect-ratio:1;min-width:0;margin:0;padding:0;border:0;display:flex;align-items:center;justify-content:center;background:var(--cell);color:var(--ink);font-family:var(--font-grid);font-weight:600;line-height:1;font-size:calc(var(--gw) / var(--n) * .40 * var(--size-mult))}
.cell .num{position:absolute;top:3px;left:4px;font-family:var(--font-ui);font-weight:700;font-size:max(9px,calc(var(--gw) / var(--n) * .19));color:var(--num)}
.cell .ltr{padding-top:.18em}
.cell.is-word{background:var(--word)}
.cell.is-wrong{background:var(--wrong-bg);color:var(--wrong)}
.cell.is-cur{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.cell.is-cur .num{color:var(--on-accent)}
.blk{aspect-ratio:1;background:var(--block) url(rain.webp) center/cover no-repeat}
body.no-rain .blk{background-image:none}
.cluebar{flex-shrink:0;display:flex;align-items:stretch;min-height:58px;border-radius:16px;background:var(--clue-bg)}
.cluebar .mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 2px;border:0;background:transparent;text-align:left;color:var(--ink)}
.tag{flex-shrink:0;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--primary);color:var(--on-primary)}
.cluebar .txt{font-size:15px;font-weight:500;line-height:1.4}
.ppanel{flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding-top:8px;padding-bottom:10px;background:var(--bg);border-top:1px solid var(--line)}
.strip{display:flex;gap:4px;overflow-x:auto;min-height:46px}
.strip .note2{flex:1;display:flex;align-items:center;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;background:color-mix(in srgb, var(--accent) 25%, var(--key))}
.k{min-width:0;height:44px;padding:0;border:1px solid var(--key-border);border-radius:12px;background:var(--key);color:var(--ink);font-size:19px;font-weight:500;box-shadow:inset 0 -2px 0 var(--key-border)}
.strip .k{flex:0 0 auto;min-width:46px;padding:0 6px;font-weight:600}
.strip.guni .k{background:color-mix(in srgb, var(--accent) 22%, var(--key))}
.k[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.acts .k{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;background:var(--chip)}
.cluelist{height:268px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.clue{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:46px;padding:9px 10px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--ink)}
.clue .n{width:26px;flex-shrink:0;font-weight:700;font-size:14px;line-height:1.55}
.clue .x{flex:1;font-size:15px;line-height:1.5}
.clue.is-on{background:var(--word)}
.clue.is-done .x{color:var(--done);text-decoration:line-through}
.tabrow{display:flex;align-items:center;gap:6px}
.tabrow .seg{flex:0 0 auto}
.phonekb{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.wide-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:16px;font-size:16px;font-weight:700;text-decoration:none;padding:0 18px}
.wide-btn.pri{background:var(--primary);color:var(--on-primary)}
.wide-btn.sec{background:var(--gold);color:#2A1F17;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.wide-btn.ter{background:var(--chip);color:var(--ink)}
.wide-btn.link{background:transparent;color:var(--primary);min-height:44px}

/* settings */
.box{display:flex;flex-direction:column;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);gap:16px}
.box h3{margin:0;font-size:15px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:8px}
.sw-row,.radio{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 0;border:0;background:transparent;text-align:left;color:var(--ink)}
.box .sw-row + .sw-row,.box .radio + .radio{border-top:1px dashed var(--line)}
.sw-row .t,.radio .t{flex:1;display:flex;flex-direction:column;gap:1px}
.sw-row .t b,.radio .t b{font-size:15px;font-weight:600}
.sw-row .t small,.radio .t small{font-size:13px;line-height:1.45;color:var(--muted)}
.sw{position:relative;flex-shrink:0;width:50px;height:30px;border-radius:999px;background:var(--off);transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;transition:left .15s}
[aria-pressed="true"] > .sw{background:var(--primary)}
[aria-pressed="true"] > .sw::after{left:24px}
.dot{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--off)}
[aria-pressed="true"] > .dot{border:7px solid var(--primary)}
.swatches{display:flex;gap:16px;padding-left:4px}
.swatch{width:46px;height:46px;border-radius:50%;border:0;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.font{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.font[aria-pressed="true"]{border:2px solid var(--primary);background:var(--gold-tint)}
.font .t{flex:1;display:flex;flex-direction:column}
.font .s{font-size:22px;line-height:1.4}
.font small{font-size:12px;color:var(--muted)}
.rainsample{width:42px;height:42px;border-radius:10px;flex-shrink:0}
.soon{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}

/* finish screen */
.done{align-items:center;text-align:center;gap:14px}
.done .art{width:min(300px,78vw);max-width:100%}
.done .art svg{display:block;width:100%;height:auto}
.dots{display:flex;justify-content:center}
.dots button{width:44px;height:36px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0}
.dots i{display:block;width:9px;height:9px;border-radius:999px;background:var(--off)}
.dots [aria-pressed="true"] i{width:24px;background:var(--primary)}
.cheer{margin:0;font-family:var(--font-display);font-weight:400;font-size:54px;line-height:1.1;color:var(--title)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.stat small{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--font-head);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.btncol{display:flex;flex-direction:column;gap:10px;width:100%}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 32px));padding:12px 16px;border-radius:16px;background:var(--toast-bg);color:var(--toast-ink);font-size:14px;font-weight:500;line-height:1.5;box-shadow:0 10px 26px rgba(42,31,23,.28);z-index:20;pointer-events:none}

/* bulb */
.b-halo1{fill:var(--b-halo);opacity:var(--b-op1)} .b-halo2{fill:var(--b-halo);opacity:var(--b-op2)}
.b-ray{stroke:var(--b-ray);fill:none;stroke-width:2.6;stroke-linecap:round}
.b-glass{fill:var(--b-glass);stroke:var(--b-line);stroke-width:2.2;stroke-linejoin:round}
.b-hi{stroke:#FFFFFF;fill:none;stroke-width:2.4;stroke-linecap:round;opacity:.9}
.b-fil{stroke:var(--b-fil);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-base{fill:var(--b-base);stroke:var(--b-line);stroke-width:2.2}
.b-lines{stroke:var(--b-line);stroke-width:1.6;fill:none} .b-tip{fill:var(--b-line)}
/* illustrations */
.f-halo{fill:var(--i-halo)} .s-ring{fill:none;stroke:var(--i-ring);stroke-width:3;stroke-dasharray:1 11;stroke-linecap:round}
.stars{fill:var(--i-gold);opacity:var(--i-star-op)}
.f-cream{fill:var(--i-cream)} .f-ink{fill:var(--i-ink)} .f-maroon{fill:var(--i-maroon)} .f-clay{fill:var(--i-clay)} .f-gold{fill:var(--i-gold)} .f-leaf{fill:var(--i-leaf)} .f-chai{fill:var(--i-chai)}
.f-glow{fill:var(--i-glow);opacity:var(--i-glow-op)} .nf{fill:none}
.s-ink{stroke:var(--i-ink)} .s-gold{stroke:var(--i-gold)} .s-clay{stroke:var(--i-clay)} .s-steam{stroke:var(--i-steam)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* admin and editor */
.lockbtn{position:relative}
.lockbtn.is-admin{background:var(--gold-tint);color:var(--pill-ink)}
.hdr-btns{display:flex;gap:8px}
.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.inp:focus{outline:3px solid var(--accent);outline-offset:1px}
textarea.inp{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.inp.sm{min-height:40px;padding:6px 8px;border-radius:10px;font-size:15px;text-align:center}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.file{display:flex;flex-direction:column;gap:6px}
.file input[type=file]{width:100%;padding:10px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);color:var(--muted);font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow .wide-btn{flex:1 1 160px}
.wide-btn[disabled]{opacity:.55;cursor:not-allowed}
.status{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--gold-tint);font-size:14px;line-height:1.5}
.status.err{background:var(--wrong-bg);color:var(--wrong)}
.status.ok{background:var(--leaf-tint);color:var(--leaf-ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.55}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:12.5px}
.implist{display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.imp{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:0;background:var(--surface);text-align:left;width:100%;color:var(--ink)}
.imp + .imp{border-top:1px dashed var(--line)}
.imp .t{flex:1;min-width:0;display:flex;flex-direction:column}
.imp .t b{font-size:15px;font-weight:600}
.imp .t small{font-size:12.5px;color:var(--muted)}
.chk{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:2px solid var(--off);display:flex;align-items:center;justify-content:center;color:var(--on-primary)}
[aria-pressed="true"] > .chk{background:var(--primary);border-color:var(--primary)}
.mgr{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 0}
.mgr + .mgr{border-top:1px dashed var(--line)}
.mgr .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mgr .t b{font-size:15px;font-weight:600}
.mgr .t small{font-size:12.5px;color:var(--muted)}
.smallbtn{min-height:40px;padding:0 12px;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font-size:13.5px;font-weight:700}
.smallbtn.danger{background:var(--wrong-bg);color:var(--wrong)}
.lockscreen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 8px}
.lockscreen .big{width:84px;height:84px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--gold-tint);color:var(--pill-ink)}
.ebar{flex-shrink:0;display:flex;align-items:center;gap:2px;height:56px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.ebar h1{flex:1;margin:0;font-family:var(--font-head);font-weight:400;font-size:18px}
.egrid{--gw:min(calc(100vw - 32px),488px);width:var(--gw);max-width:100%;margin-inline:auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;padding:2px;border-radius:10px;background:var(--grid-line)}
.ecell{position:relative;aspect-ratio:1;min-width:0;margin:0;padding:0;border:0;display:flex;align-items:center;justify-content:center;background:var(--cell);color:var(--ink);font-family:var(--font-grid);font-weight:600;line-height:1;font-size:calc(var(--gw) / var(--n) * .38)}
.ecell .num{position:absolute;top:2px;left:3px;font-family:var(--font-ui);font-weight:700;font-size:max(8px,calc(var(--gw) / var(--n) * .2));color:var(--num)}
.ecell .ltr{padding-top:.18em}
.ecell.b{background:#1E1714}
.ecell.b .num{color:#F5EBDD}
.ecell.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.ecell.run{background:var(--word)}
.ecell.miss{color:var(--wrong)}
.cluerow{display:grid;grid-template-columns:56px minmax(0,1fr) 52px 40px;gap:6px;align-items:center}
.cluerow .x{width:40px;height:40px;border:0;border-radius:10px;background:var(--wrong-bg);color:var(--wrong);font-size:18px;font-weight:700}
.problems{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.5}
.srcimgs{display:flex;gap:8px;overflow-x:auto}
.srcimgs img{height:140px;border-radius:10px;border:1px solid var(--line)}
.numedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numedit .inp.sm{width:80px}
.bignote{font-size:14px;line-height:1.6;margin:0}

/* English → Telugu typing and clue fixing */
.acts.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.acts.five .k{font-size:13px}
.typebox{display:flex;flex-direction:column;gap:8px}
.tl-row{display:flex;gap:8px;align-items:center}
.tl-row .inp{flex:1;min-width:0;font-size:18px}
.smallbtn.pri{background:var(--primary);color:var(--on-primary);min-height:46px;padding:0 18px}
.tl-cands{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px}
.tlc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--key-border);background:var(--key);color:var(--ink);font-family:var(--font-grid);font-size:19px;font-weight:600;box-shadow:inset 0 -2px 0 var(--key-border)}
.tlc small{font-family:var(--font-ui);font-size:11px;font-weight:700;color:var(--muted)}
.tlc.fit{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 24%, var(--key))}
textarea.inp.tel{font-family:var(--font-ui);font-size:17px;line-height:1.55;min-height:96px}
.fixbox{display:flex;flex-direction:column;gap:10px}
.hintwait{display:block;max-width:112px;font-size:12.5px;font-weight:600;line-height:1.3;text-align:right;color:var(--muted)}

/* squares in the blog's style: light-blue rounded tiles with a grey border, yellow + red outline for the selected one */
:root{--cell-border:#808080;--word:color-mix(in srgb, var(--accent) 45%, #FFFFFF)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cell-border:#5F86A6;--word:color-mix(in srgb, var(--accent) 35%, #23455E)}}
:root[data-theme="dark"]{--cell-border:#5F86A6;--word:color-mix(in srgb, var(--accent) 35%, #23455E)}
:root[data-app-theme="cozy"],:root[data-app-theme="white"]{--cell-border:#808080;--word:color-mix(in srgb, var(--accent) 45%, #FFFFFF)}
:root[data-app-theme="night"]{--cell-border:#5F86A6;--word:color-mix(in srgb, var(--accent) 35%, #23455E)}
.grid{gap:3px;padding:4px;border-radius:12px;background:var(--surface)}
.cell{border:1.5px solid var(--cell-border);border-radius:4px}
.cell .num{font-style:italic}
.cell.is-cur{box-shadow:none;border:2px solid #D32F2F}
.cell.is-cur .num{color:#8E1B13}
.blk{border:1.5px solid var(--cell-border);border-radius:4px}
.minigrid span{background:var(--cell)}
.minigrid span.on{background:var(--gold)}
.ecell{border-radius:2px}

/* keyboard bar: Telugu / English switch and hide */
.kbbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kbbar .seg button{min-height:36px;padding:0 16px}
.kbbar .smallbtn{display:inline-flex;align-items:center;gap:4px;min-height:40px}
.acts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kbhidden{display:flex;gap:8px;align-items:center}
.kbhidden .wide-btn{flex:1;min-height:48px}
.kbhidden .smallbtn{display:inline-flex;align-items:center;gap:6px;min-height:48px}

/* zoom: the grid scrolls inside its own strip */
.gridwrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding:1px 0 3px}
.ghostbtn[disabled]{opacity:.35;cursor:default}
.pbar h1{font-size:16px}

/* the puzzle screen scrolls as one page: the board moves between the pinned top bar and the pinned clue bar + keyboard */
#view.is-fixed{overflow-y:auto;scroll-padding-top:64px;scroll-padding-bottom:var(--kbh,320px)}
.play{flex:none;min-height:100%}
.pbar{position:sticky;top:0;z-index:6}
.pmid{flex:1 0 auto;overflow:visible;min-height:0;padding-bottom:12px}
.pbottom{position:sticky;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding-top:8px;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 18px rgba(42,31,23,.10)}
.pbottom .ppanel{border-top:0;padding-top:0}

/* answer colours as on the blog: right = grey with a green border and blue letter, wrong = gold with a red border and red letter.
   The selected square gets a blue frame (not red), and the selected word a pale blue tint, so neither can be mistaken for a wrong answer. */
:root{--ok-bg:#EEEEEE;--ok-bd:#008000;--ok-ink:#0000FF;--bad-bg:#FFD700;--bad-bd:#E00000;--bad-ink:#C00000;--sel:#0B57D0;--sel-bg:#FFFFFF;--word:#D4ECFF;--word-ring:#5B9BE0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok-bg:#22322A;--ok-bd:#4CC26A;--ok-ink:#A9C4FF;--bad-bg:#5E4C00;--bad-bd:#FF6B6B;--bad-ink:#FFD2D2;--sel:#FFFFFF;--sel-bg:#2E5A7C;--word:#2B5677;--word-ring:#8CC4F2}}
:root[data-theme="dark"]{--ok-bg:#22322A;--ok-bd:#4CC26A;--ok-ink:#A9C4FF;--bad-bg:#5E4C00;--bad-bd:#FF6B6B;--bad-ink:#FFD2D2;--sel:#FFFFFF;--sel-bg:#2E5A7C;--word:#2B5677;--word-ring:#8CC4F2}
:root[data-app-theme="cozy"],:root[data-app-theme="white"]{--ok-bg:#EEEEEE;--ok-bd:#008000;--ok-ink:#0000FF;--bad-bg:#FFD700;--bad-bd:#E00000;--bad-ink:#C00000;--sel:#0B57D0;--sel-bg:#FFFFFF;--word:#D4ECFF;--word-ring:#5B9BE0}
:root[data-app-theme="night"]{--ok-bg:#22322A;--ok-bd:#4CC26A;--ok-ink:#A9C4FF;--bad-bg:#5E4C00;--bad-bd:#FF6B6B;--bad-ink:#FFD2D2;--sel:#FFFFFF;--sel-bg:#2E5A7C;--word:#2B5677;--word-ring:#8CC4F2}
.cell.is-word{background:var(--word);box-shadow:inset 0 0 0 1px var(--word-ring)}
.cell.is-ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-ink)}
.cell.is-wrong{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-ink)}
.cell.is-wrong .num{color:var(--bad-ink)}
.cell.is-word.is-ok,.cell.is-word.is-wrong{box-shadow:inset 0 0 0 2px var(--word-ring)}
.cell.is-cur{background:var(--sel-bg);color:var(--ink);border:3px solid var(--sel);box-shadow:0 0 0 2px color-mix(in srgb, var(--sel) 35%, transparent)}
.cell.is-cur.is-ok{background:var(--ok-bg);color:var(--ok-ink)}
.cell.is-cur.is-wrong{background:var(--bad-bg);color:var(--bad-ink)}
.cell.is-cur .num{color:var(--num)}
.cell.is-cur.is-wrong .num{color:var(--bad-ink)}
.cell.is-pre{background:var(--sel-bg);border:2px dashed var(--sel);color:var(--sel)}

/* the selected word, square by square, above the typing box */
.wstrip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,44px));justify-content:center;gap:4px}
.sc{aspect-ratio:1;min-width:0;max-width:100%;margin:0;padding:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--cell-border);border-radius:6px;background:var(--cell);color:var(--ink);font-family:var(--font-grid);font-weight:600;font-size:clamp(13px,4.6vw,21px);line-height:1}
.sc.is-ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-ink)}
.sc.is-wrong{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-ink)}
.sc.is-pre{background:var(--sel-bg);border:2px dashed var(--sel);color:var(--sel)}
.sc.is-cur{border:3px solid var(--sel)}

/* compact typing panel so the board stays visible above the phone keyboard */
.kbbar .kbr{display:flex;gap:6px;align-items:center}
.kbbar .kbr .smallbtn{padding:0 10px}
.tl-row .inp{min-height:44px}
.helpbtn{width:40px;height:40px;flex-shrink:0;font-weight:700;font-size:17px}
.tl-cands{flex-wrap:nowrap;overflow-x:auto;min-height:44px;scrollbar-width:none}
.tl-cands .tlc{flex-shrink:0}
.tl-cands .note{white-space:nowrap}
#app{height:calc(var(--app-h, 100%) - 0px)}
:root[style*="--app-h"] #app{height:calc(var(--app-h) - env(safe-area-inset-top,0px))}
#view.typing .pbar{position:static}
#view.typing{scroll-padding-top:8px}

/* a right answer is frozen: grey with a green border even when selected (selection shows as a blue ring outside it) */
.cell.is-cur.is-ok{border:2px solid var(--ok-bd);box-shadow:0 0 0 3px var(--sel)}
.sc.is-cur.is-ok{border:2px solid var(--ok-bd);box-shadow:0 0 0 3px var(--sel)}

/* scroll bar for the zoomed board, in the pinned area */
.hbar{display:flex;align-items:center;gap:6px}
.hbar .ghostbtn{width:36px;height:32px;flex-shrink:0}
.htrack{position:relative;flex:1;height:22px;border-radius:999px;background:var(--chip);touch-action:none;cursor:pointer}
.hthumb{position:absolute;top:3px;bottom:3px;left:0;width:30%;border-radius:999px;background:var(--primary)}
.gridwrap{scrollbar-width:thin;scrollbar-color:var(--primary) transparent}
.gridwrap::-webkit-scrollbar{height:8px}
.gridwrap::-webkit-scrollbar-thumb{background:var(--primary);border-radius:8px}

/* Telugu fonts: grid, clues and headings each have their own choice; a size factor evens out how big each font draws */
.cell{font-weight:var(--grid-wt,600);font-size:calc(var(--gw) / var(--n) * .40 * var(--size-mult) * var(--grid-scale,1));font-synthesis-weight:none}
.sc{font-weight:var(--grid-wt,600);font-size:calc(clamp(13px,4.6vw,21px) * var(--grid-scale,1));font-synthesis-weight:none}
.keys .k,.strip .k,.tlc{font-family:var(--font-grid);font-weight:var(--grid-wt,600);font-synthesis-weight:none}
.keys .k,.strip .k{font-size:calc(18px * min(var(--grid-scale,1), 1.3))}
.tlc{font-size:calc(17px * min(var(--grid-scale,1), 1.3))}
.ecell{font-family:var(--font-grid);font-weight:var(--grid-wt,600);font-synthesis-weight:none}
.cluebar .txt,.clue .x{font-family:var(--font-clue);font-weight:var(--clue-wt,500);font-size:calc(15px * var(--clue-scale,1))}
.apptitle{font-size:calc(40px * var(--head-scale,1))}
.sec-h{font-size:calc(18px * var(--head-scale,1))}
.hero h2{font-size:calc(23px * var(--head-scale,1))}
.pbar h1{font-size:calc(16px * var(--head-scale,1))}
.cheer{font-size:calc(54px * var(--head-scale,1))}
.fsets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fset{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.fset[aria-pressed="true"]{border:2px solid var(--primary);background:var(--gold-tint)}
.fset .nm{line-height:1.3;color:var(--title)}
.fset .tiles{display:flex;gap:3px}
.fset .tiles span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--cell);border:1.5px solid var(--cell-border);border-radius:4px;color:var(--ink);line-height:1}
.fset .cl{line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpicks{display:flex;flex-direction:column;gap:8px}
.fpick{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:8px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.fpick .t{flex:1;min-width:0;display:flex;flex-direction:column}
.fpick .t small{font-size:12px;font-weight:600;color:var(--muted)}
.fpick .s{line-height:1.35}
.fpick .fn{font-size:12.5px;color:var(--muted);text-align:right}
.fpick .chev{font-size:14px;color:var(--muted)}
.fpick[aria-expanded="true"]{border-color:var(--primary)}
.flist{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto;padding:2px}

/* black-square picture choice */
.blk{background-size:cover;background-position:center}
.blkopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.blkopt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;text-align:center}
.blkopt[aria-pressed="true"]{border:2px solid var(--primary);background:var(--gold-tint)}
.blkrow{display:flex;gap:3px;justify-content:center}
.scsample,.rainsample,.plainsample{display:block;width:30px;height:30px;border-radius:5px;border:1.5px solid var(--cell-border);background-size:cover;background-position:center}
.rainsample{width:42px;height:30px;background:var(--block) url(rain.webp) center/cover}
.plainsample{width:42px;height:30px;background:var(--block)}

/* screen recording (computers), like the blog's రికార్డు చేయండి button */
.recbtn .recdot{width:16px;height:16px;border-radius:50%;border:2.5px solid #C62828;background:transparent}
.recbtn.is-on .recdot{background:#E53935;border-color:#E53935;animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{opacity:.35}}
.recpill{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:#2A1F17;color:#FFF;font-size:13.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.recpill .recdot{width:10px;height:10px;border-radius:50%;background:#FF5252;animation:recp 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.recbtn.is-on .recdot,.recpill .recdot{animation:none}}

/* loading screen: a little grid fills in while posts arrive */
.loading{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:48px 8px 24px}
.loading.sm{padding:16px 0 8px;gap:10px}
.ldgrid{display:grid;grid-template-columns:repeat(3,52px);gap:4px;padding:5px;border-radius:12px;background:var(--surface);box-shadow:0 6px 18px rgba(42,31,23,.12)}
.loading.sm .ldgrid{grid-template-columns:repeat(3,38px)}
.ldgrid span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:5px;border:1.5px solid var(--cell-border);font-family:var(--font-grid);font-size:calc(21px * min(var(--grid-scale,1), 1.25));font-weight:var(--grid-wt,600);font-synthesis-weight:none;line-height:1}
.loading.sm .ldgrid span{font-size:calc(16px * min(var(--grid-scale,1), 1.25))}
.ldgrid .t{background:var(--cell);color:transparent;animation:ldfill 3.2s ease-in-out infinite}
.ldgrid .b{background:var(--block) url(rain.webp) center/cover}
@keyframes ldfill{0%,8%{color:transparent;background:var(--cell)}18%,70%{color:var(--ok-ink);background:var(--ok-bg);border-color:var(--ok-bd)}85%,100%{color:transparent;background:var(--cell)}}
.ldmsg{margin:0;font-size:16px;font-weight:600;color:var(--ink);min-height:1.6em}
.ldmsg.in{animation:ldin .4s ease-out}
@keyframes ldin{from{opacity:0;transform:translateY(4px)}}
.ldbar{width:min(240px,70%);height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.ldbar i{display:block;width:40%;height:100%;border-radius:999px;background:var(--primary);animation:ldbar 1.4s ease-in-out infinite}
@keyframes ldbar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion: reduce){.ldgrid .t{animation:none;color:var(--ink)}.ldbar i{animation:none;width:100%;opacity:.5}.ldmsg.in{animation:none}}

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var view = document.getElementById('view');
  var tabs = document.getElementById('tabs');
  var toastEl = document.getElementById('toast');
  // Inside Claude this page is the admin studio; on your own website it is the public reader that loads the blog live.
  var IS_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
  var BLOG_STATE = 'loading';

  var BLOG = 'https://telugupadavinodam.blogspot.com/';
  var FEED = BLOG + 'feeds/posts/default?alt=json&max-results=500';
  var WEEKDAYS = ['ఆదివారం', 'సోమవారం', 'మంగళవారం', 'బుధవారం', 'గురువారం', 'శుక్రవారం', 'శనివారం'];
  var MONTHS = ['జనవరి', 'ఫిబ్రవరి', 'మార్చి', 'ఏప్రిల్', 'మే', 'జూన్', 'జూలై', 'ఆగస్టు', 'సెప్టెంబర్', 'అక్టోబర్', 'నవంబర్', 'డిసెంబర్'];
  var AKSHARA = /[క-హౘ-ౚ](?:్[క-హౘ-ౚ])*(?:[ా-ౌౕౖ]|్(?![క-హ]))?[ఀ-ః]?|[అ-ఔౠౡ][ఀ-ః]?|\S/g;

  /* ================= puzzles =================
     A puzzle: {id, title, date 'DD.MM.YYYY', src, url?, grid: ['..#.'], nums: {'r,c': n}, ans: [['క','',..]] | null,
                clues: [{d:'A'|'D', n, len, text}]} */
  function sampleToPuzzle() {
    var rows = [
      ['క', 'మ', 'లం', null, 'పా', 'వు', 'రం'], ['లు', null, 'గ', null, 'య', null, 'గు'], ['వ', 'న', 'రు', null, 'సం', 'కె', 'లు'],
      [null, null, null, null, null, null, null],
      ['కో', 'కి', 'ల', null, 'ఉ', 'గా', 'ది'], ['వె', null, 'క్ష', null, 'య్యా', null, 'క్కు'], ['ల', 'వ', 'ణం', null, 'ల', 'త', 'లు']];
    var text = {
      A1: 'తామర పువ్వు', A3: 'శాంతికి చిహ్నమైన పక్షి', A5: 'నీరు, అడవి వంటి సహజ సంపద', A6: 'ఖైదీ కాళ్ళకు వేసేవి', A7: 'వసంతంలో కూసే పక్షి', A9: 'తెలుగు సంవత్సరాది', A11: 'ఉప్పు', A12: 'తీగలు',
      D1: 'వెన్నెలలో విచ్చే పువ్వు', D2: 'ఓడను నిలిపే ఇనుప సాధనం', D3: 'పండుగ రోజు చేసే తీపి వంటకం', D4: 'హరివిల్లులో ఏడు', D7: 'గుడి, దేవాలయం', D8: 'గుణం, స్వభావం', D9: 'పసిపాపను ఊపే తొట్టి', D10: 'తూర్పు, పడమర వంటివి'
    };
    var p = { id: 'sample', title: 'నమూనా పద వినోదం', date: '', src: 'sample', grid: [], nums: {}, ans: [], clues: [] };
    rows.forEach(function (r) { p.grid.push(r.map(function (x) { return x === null ? '#' : '.'; }).join('')); p.ans.push(r.map(function (x) { return x || ''; })); });
    autoNumber(p);
    Object.keys(text).forEach(function (k) { p.clues.push({ d: k[0], n: +k.slice(1), len: 3, text: text[k] }); });
    return p;
  }
  function autoNumber(p) {
    var R = p.grid.length, C = p.grid[0].length, n = 0; p.nums = {};
    function w(r, c) { return r >= 0 && c >= 0 && r < R && c < C && p.grid[r][c] !== '#'; }
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      if (!w(r, c)) continue;
      if ((!w(r, c - 1) && w(r, c + 1)) || (!w(r - 1, c) && w(r + 1, c))) p.nums[r + ',' + c] = ++n;
    }
  }
  var SAMPLE = sampleToPuzzle();
  var PUZZLES = [];
  var DATA_STATE = 'loading';

  function key(r, c) { return r + ',' + c; }
  function dateKey(d) { var m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(d || ''); return m ? m[3] + m[2] + m[1] : '00000000'; }
  function weekday(d) { var m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(d || ''); if (!m) return ''; var dt = new Date(+m[3], +m[2] - 1, +m[1]); return WEEKDAYS[dt.getDay()] || ''; }
  function monthName(d) { var m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(d || ''); return m ? MONTHS[+m[2] - 1] + ' ' + m[3] : 'తేదీ లేనివి'; }
  function sorted() { return PUZZLES.slice().sort(function (a, b) { return dateKey(b.date).localeCompare(dateKey(a.date)); }); }
  function findPuzzle(id) {
    if (id === 'sample') return SAMPLE;
    if (id === 'draft') return D ? draftToPuzzle(D, true) : null;
    for (var i = 0; i < PUZZLES.length; i++) if (PUZZLES[i].id === id) return PUZZLES[i];
    return null;
  }

  var MODELS = {};
  function model(p) {
    if (p.id !== 'draft' && MODELS[p.id] && MODELS[p.id].p === p) return MODELS[p.id];
    var R = p.grid.length, C = R ? p.grid[0].length : 0;
    function isW(r, c) { return r >= 0 && c >= 0 && r < R && c < C && p.grid[r][c] !== '#'; }

          try { navigator.clipboard.writeText(body).then(function () { toast('ఇక్కడ సేవ్ కుదరలేదు — ఫైల్ విషయాన్ని కాపీ చేశాం. puzzles.json పేరుతో అతికించి సేవ్ చేయండి.'); }, function () { toast('ఈ వీక్షణలో ఫైల్ సేవ్ చేయడం కుదరదు.'); }); } catch (x) { toast('ఈ వీక్షణలో ఫైల్ సేవ్ చేయడం కుదరదు.'); }
        });
        break;
      case 'draft-drop':
        if (U.confirm !== 'drop') { U.confirm = 'drop'; render(); break; }
        D = null; S.draft = null; U.confirm = ''; save(); location.hash = '#admin'; break;
    }
  });
  function selectText(id) { var el = document.getElementById(id); if (!el) return; var rg = document.createRange(); rg.selectNodeContents(el); var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg); toast('లింక్‌ను ఎంచుకున్నాం — కాపీ చేయండి.'); }
  view.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'tl-in') { if (!ev.isComposing) tlInput(t); else updateCands(); return; }
    if (t.id === 'fix-in') { if (!ev.isComposing) autoConvertField(t); return; }
    if (t.id === 'arch-q') { U.query = t.value; var res = document.getElementById('arch-res'); if (res) res.innerHTML = archiveResults(); return; }
    if (!D) return;
    if (t.hasAttribute('data-df')) { D[t.getAttribute('data-df')] = t.value; saveDraft(); return; }
    if (t.hasAttribute('data-ci')) {
      var f = t.getAttribute('data-f'); if (f === 'text') autoConvertField(t);
      var cl = D.clues[+t.getAttribute('data-ci')];
      if (cl) { cl[f] = f === 'text' ? t.value : (parseInt(t.value, 10) || ''); saveDraft(); var ch = document.getElementById('checks'); if (ch) ch.innerHTML = draftChecks(); }
    }
  });
  view.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'imp-files' && t.files.length) { Promise.all(Array.prototype.map.call(t.files, readFileText)).then(runImport, function () { U.status = { kind: 'err', text: 'ఫైల్ తెరవలేకపోయాం.' }; render(); }); }
    if (t.id === 'ans-files' && t.files.length) aiRead('answers', t.files);
  });

  view.addEventListener('compositionend', function (ev) {
    var t = ev.target;
    if (t.id === 'tl-in') tlInput(t);
    else if (t.id === 'fix-in' || t.getAttribute('data-f') === 'text') autoConvertField(t);
  });
  view.addEventListener('keydown', function (ev) {
    var t = ev.target;
    if (t.id !== 'tl-in') return;
    if (ev.key === 'Enter') { ev.preventDefault(); var c = pickFor(t.value); t.value = ''; if (c) commitTyped(c); var n = document.getElementById('tl-in'); if (n) { n.focus(); updateCands(); } }
    else if (ARROWS[ev.key] && route().indexOf('play-') === 0 && CUR && (!t.value || ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); if (moveSel(ev.key)) refreshPlay(); }
    else if (ev.key === 'Backspace' && !t.value) { ev.preventDefault(); if (route() === 'edit') editBack(); else back(true); var n2 = document.getElementById('tl-in'); if (n2) n2.focus(); }
  });
  // arrow keys move the selected square across or down the board (jumping over black squares); the board scrolls along
  var ARROWS = { ArrowUp: [-1, 0, 'D'], ArrowDown: [1, 0, 'D'], ArrowLeft: [0, -1, 'A'], ArrowRight: [0, 1, 'A'] };
  function moveSel(k) {
    var mv = ARROWS[k], m = CUR.m, P = CUR.P, rr = P.r + mv[0], cc = P.c + mv[1];
    while (rr >= 0 && cc >= 0 && rr < m.R && cc < m.C && !m.isW(rr, cc)) { rr += mv[0]; cc += mv[1]; }
    if (rr < 0 || cc < 0 || rr >= m.R || cc >= m.C || !m.isW(rr, cc)) return false;
    P.r = rr; P.c = cc; var kk = key(rr, cc); if (mv[2] === 'A' ? m.cellA[kk] : m.cellD[kk]) { P.dir = mv[2]; U.tab = mv[2]; }
    U.follow = true; save(); return true;
  }
  // buttons beside the typing box must not steal its focus (that would close the phone keyboard)
  view.addEventListener('pointerdown', function (ev) {
    var a = document.activeElement;
    if (a && a.id === 'tl-in' && ev.target.closest('[data-keepfocus]')) ev.preventDefault();
  });

  document.addEventListener('keydown', function (ev) {
    var r = route(); if (r.indexOf('play-') !== 0 || !CUR || (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName))) return;
    if (/^[a-zA-Z]$/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey && U.panel !== 'fix') {
      ev.preventDefault();
      if (U.panel !== 'type') { U.panel = 'type'; render(); }
      var ti = document.getElementById('tl-in'); if (ti) { ti.focus(); ti.value += ev.key; tlInput(ti); }
      return;
    }
    if (ARROWS[ev.key]) { ev.preventDefault(); if (moveSel(ev.key)) render(); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); back(); }
  });

  view.addEventListener('scroll', function (ev) { if (ev.target.classList && ev.target.classList.contains('gridwrap')) syncHbar(); }, true);
  (function () {
    var drag = false;
    function to(ev) {
      var tr = document.getElementById('htrack'), gw = view.querySelector('.gridwrap'), th = document.getElementById('hthumb'); if (!tr || !gw || !th) return;
      var r = tr.getBoundingClientRect(), tw = th.getBoundingClientRect().width, f = (ev.clientX - r.left - tw / 2) / Math.max(1, r.width - tw);
      gw.scrollLeft = Math.max(0, Math.min(1, f)) * (gw.scrollWidth - gw.clientWidth);
    }
    view.addEventListener('pointerdown', function (ev) { if (!ev.target.closest('#htrack')) return; drag = true; ev.preventDefault(); try { ev.target.closest('#htrack').setPointerCapture(ev.pointerId); } catch (e) {} to(ev); });
    view.addEventListener('pointermove', function (ev) { if (drag) to(ev); });
    view.addEventListener('pointerup', function () { drag = false; });
    view.addEventListener('pointercancel', function () { drag = false; });
  })();
  view.addEventListener('focusin', function (ev) { if (ev.target.id === 'tl-in') { view.classList.add('typing'); U.follow = true; setTimeout(function () { keepCurVisible(); }, 300); } });
  view.addEventListener('focusout', function (ev) { if (ev.target.id === 'tl-in') view.classList.remove('typing'); });
  (function () {
    var vv = window.visualViewport; if (!vv) return;
    function fit() {
      var root = document.documentElement;
      if (Math.abs(vv.scale - 1) > 0.02 || window.innerHeight - vv.height < 80) root.style.removeProperty('--app-h');
      else { root.style.setProperty('--app-h', Math.round(vv.height) + 'px'); if (window.scrollY) window.scrollTo(0, 0); }
      if (CUR && route().indexOf('play-') === 0) { U.follow = true; keepCurVisible(); }
    }
    vv.addEventListener('resize', fit);
  })();

  setInterval(function () {
    if (!CUR || route().indexOf('play-') !== 0 || CUR.P.done || document.visibilityState !== 'visible' || !CUR.P.started) return;
    CUR.P.elapsed++; var tm = document.getElementById('tm'); if (tm) tm.textContent = fmt(CUR.P.elapsed);
    if (CUR.P.elapsed % 10 === 0) save();
  }, 1000);
  document.addEventListener('visibilitychange', save);
  window.addEventListener('hashchange', onRoute);

  // Posts = everything on the blog (website only) + puzzles.json (studio uploads and corrections, which win on the same date)
  var extraP = fetch('puzzles.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
    return Array.isArray(j.puzzles) ? j.puzzles.filter(function (p) { return p && p.id && Array.isArray(p.grid) && p.grid.length; }) : [];
  }).catch(function () { return []; });
  var blogP = IS_CLAUDE ? Promise.resolve([]) : loadBlogFeed().then(function (j) { BLOG_STATE = 'ready'; return postsFromFeed(j); }, function () { BLOG_STATE = 'error'; return []; });
  Promise.all([extraP, blogP]).then(function (res) {
    var extra = res[0], blog = res[1], byDate = {}, taken = {};
    extra.forEach(function (p) { taken[p.id] = true; if (p.date) byDate[p.date] = true; });
    var list = extra.slice();
    blog.forEach(function (p) { if (p.date && byDate[p.date]) return; p.id = makeId(p.date, taken); taken[p.id] = true; list.push(p); });
    PUZZLES = list; MODELS = {}; DATA_STATE = 'ready'; render();
  });
  if (!IS_CLAUDE && 'serviceWorker' in navigator && location.protocol === 'https:') {
    // when a newer version of the app takes over, reload once so the new screens show straight away
    var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update().catch(function () {}); }).catch(function () {}); });
  }

  applyPrefs();
  onRoute();
})();
